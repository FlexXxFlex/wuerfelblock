html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;font-size:15px;padding-bottom:92px}
.wrap{max-width:900px;margin:0 auto;height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:calc(4px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0
          calc(8px + env(safe-area-inset-left))}

/* Schmale Leiste unter der Statusleiste – bleibt beim Scrollen stehen */
.mini{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;flex:0 0 auto}
.mini .now{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:999px;padding:5px 12px;font:800 12px inherit;cursor:pointer;white-space:nowrap}
/* Kopfbereich klappt beim Scrollen weg */
.bighead{flex:0 0 auto;overflow:hidden;max-height:260px;will-change:max-height;
  transition:max-height .24s ease, opacity .18s ease}
.bighead.hide{max-height:0;opacity:0}

header.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 6px;flex:0 0 auto}
.logo{font-size:24px;line-height:.95;font-weight:800;letter-spacing:-1px;font-style:italic}
.logo b{font-style:normal}
.logo small{display:block;font-size:9.5px;font-weight:600;letter-spacing:2px;font-style:normal;color:var(--ink-soft);margin-top:2px}
.byfoot{display:inline-block;margin-top:4px;font-size:10.5px;letter-spacing:1px;
  color:var(--ink-soft);opacity:.8}
.byfoot b{font-weight:800;color:var(--ink);letter-spacing:0}

.coopbar{display:flex;align-items:center;gap:8px;padding:0 4px 8px;flex:0 0 auto}
#coopChip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--rule);background:var(--card);
  border-radius:999px;padding:7px 13px;font:700 12.5px inherit;color:var(--ink-soft);cursor:pointer}
#coopChip .dot{width:8px;height:8px;border-radius:50%;background:#c3c6d8;flex:0 0 auto}
#coopChip.live{color:var(--ink);border-color:var(--live)}
#coopChip.live .dot{background:var(--live);animation:pulse 2s infinite}
#coopChip.wait .dot{background:#e0a83c}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 4px 8px;scrollbar-width:none;flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:7px 14px;font:700 13px inherit;cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.add{border-style:dashed;font-weight:800}

/* Dieser Bereich scrollt – dadurch bleibt die Namenszeile oben kleben */
.scroller{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:104px;overscroll-behavior:none}
/* Ohne feste Aufteilung schluckt die Beschriftungsspalte auf breiten Geräten
   den ganzen Rest – Tabellenzellen beachten max-width nämlich nicht. */
/* Nur so breit wie die Spalten es brauchen, und mittig. Sonst verteilt der
   Browser den Überschuss auf die Beschriftungsspalte – auf dem iPad sichtbar. */
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:min(100%,max-content);
  margin:0 auto;table-layout:fixed;background:var(--card)}
th,td{border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft)}
thead th{background:var(--shade);padding:5px 3px;text-align:center;position:sticky;top:0;z-index:3;
  vertical-align:top;box-shadow:0 2px 0 var(--rule)}
th.lbl{position:sticky;left:0;top:0;z-index:5;text-align:left;padding:10px 6px 10px 8px;
  width:126px;min-width:126px;max-width:126px;font:800 10px/1.3 inherit;letter-spacing:1.5px;color:var(--ink)}
th.pcol{width:78px;min-width:78px;position:sticky;top:0;z-index:3}
th.pcol input{width:100%;border:none;border-bottom:1.5px solid var(--rule);background:transparent;
  font:800 12px inherit;color:var(--pencil);text-align:center;padding:14px 2px 4px;min-width:0}
th.pcol input:focus{outline:none;border-bottom-color:var(--ink)}
th.pcol .kill{position:absolute;top:2px;right:3px;border:none;background:none;color:#adb0c8;font-size:12px;line-height:1;cursor:pointer;padding:2px 4px}
th.addcol{width:44px;min-width:44px}
/* Spalte unter dem Plus-Knopf bleibt neutral, auch in Summen- und Trennzeilen */
#grid td.pad, #grid tr.sum td.pad, #grid tr.total td.pad, #grid tr.sep td.pad{
  background:var(--paper);border:none}
th.addcol button{border:1.5px dashed var(--rule);background:var(--card);color:var(--ink-soft);
  border-radius:8px;width:32px;height:32px;font:800 16px inherit;cursor:pointer;margin-top:6px}

td.lbl{position:sticky;left:0;z-index:2;background:var(--card);width:126px;min-width:126px;max-width:126px;
  padding:5px 6px 5px 8px;border-right:2px solid var(--rule)}
td.lbl .n{display:block;font-size:12.5px;font-weight:700;line-height:1.15}
td.lbl .h{display:block;font-size:9.5px;color:var(--ink-soft);font-weight:600;margin-top:1px}
td.lbl .h.d{display:flex;align-items:center;gap:5px;margin-top:2px}
td.cell{width:78px;min-width:78px;height:38px;text-align:center;cursor:pointer;
  font:700 16px/1 "Avenir Next",system-ui,sans-serif;color:var(--pencil);position:relative}
td.cell:active{background:#eef0fa}
@keyframes hlMine{from{background:#e3e7fb}to{background:transparent}}
@keyframes hlTheirs{from{background:#c9edda}to{background:transparent}}
td.cell.hl-mine{animation:hlMine 1.1s ease-out}
td.cell.hl-theirs{animation:hlTheirs 4.5s ease-out}
td.cell.hl-theirs::before{content:'';position:absolute;top:3px;left:4px;width:5px;height:5px;
  border-radius:50%;background:var(--live);animation:hlDot 4.5s ease-out forwards}
@keyframes hlDot{0%,60%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  td.cell.hl-mine,td.cell.hl-theirs{animation-duration:.01s}
  td.cell.hl-theirs{background:#eaf7f0}
}
/* Gestrichenes Feld: gezeichneter Strich, so kräftig wie die Ziffern */
td.cell .zero{display:inline-block;width:16px;height:2.6px;border-radius:2px;
  background:#a9adc6;font-size:0;line-height:0;vertical-align:middle}
td.cell .dbl{display:block;font-size:8.5px;color:var(--ink-soft);font-weight:700;margin-top:1px}

tr.sum td{background:var(--shade);font-weight:800;cursor:default}
tr.sum td.lbl{background:var(--shade)}
tr.sum td.cell{color:var(--ink)}
tr.total td{background:var(--ink);color:#fff;border-color:#5a5e8c}
tr.total td.lbl{background:var(--ink)}
tr.total td.lbl .n{color:#fff}
tr.total td.cell{color:#fff;font-size:17px}
tr.total td.cell.lead{color:#ffd873}
tr.total td.cell.lead::after{content:'★';position:absolute;top:2px;right:5px;font-size:9px;color:#ffd873}
tr.bonus td.cell.hit{color:var(--ok)}
tr.sep td{border-top:2.5px solid var(--ink)}
.dice{display:inline-flex;gap:2px;vertical-align:middle;flex:0 0 auto}
.die{width:9px;height:9px;border:1px solid var(--ink-soft);border-radius:2px;display:grid;place-items:center}
.die i{width:2px;height:2px;background:var(--ink-soft);border-radius:50%;display:block}

/* Ebene über den klebenden Tabellenzellen (die liegen auf 2 bis 5) */
footer{position:fixed;left:0;right:0;bottom:0;z-index:12;background:rgba(242,241,236,.97);backdrop-filter:blur(8px);
  border-top:1.5px solid var(--rule);
  padding:8px calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom))
          calc(12px + env(safe-area-inset-left));
  display:flex;align-items:center;justify-content:space-between;gap:10px}
footer{display:block}
footer .fin{max-width:900px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:10px}
footer .lead-l{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--ink-soft)}
footer .val{font-size:20px;font-weight:800;line-height:1.15}
footer .btns{display:flex;gap:6px}
footer button{border:1.5px solid var(--rule);background:var(--card);color:var(--ink);
  border-radius:9px;padding:9px 11px;font:700 13px inherit;cursor:pointer}
footer button.primary{background:var(--ink);border-color:var(--ink);color:#fff}

.veil{position:fixed;inset:0;background:rgba(30,32,58,.45);display:none;z-index:20}
.veil.on{display:block}
.sheetbox{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);
  border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(110%);transition:transform .22s ease;box-shadow:0 -8px 30px rgba(40,42,70,.25);
  max-width:760px;margin:0 auto}
.sheetbox.on{transform:translateY(0)}
.sheetbox h3{margin:0;font-size:17px;font-weight:800}
.sheetbox .sub{font-size:12px;color:var(--ink-soft);font-weight:700;margin:2px 0 14px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opts button{border:1.5px solid var(--rule);background:var(--paper);border-radius:10px;
  padding:13px 4px;font:800 17px inherit;color:var(--pencil);cursor:pointer}
.opts button.big{grid-column:span 2}
.opts button.strike{color:#a9adc6;font-weight:600}
.opts button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.numrow{display:flex;gap:8px;margin-bottom:10px}
.numrow input{flex:1;border:1.5px solid var(--rule);border-radius:10px;padding:12px;
  font:800 22px inherit;text-align:center;color:var(--pencil);background:var(--paper)}
.numrow input:focus{outline:none;border-color:var(--ink)}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 button{flex:1;border-radius:10px;padding:12px;font:800 14px inherit;cursor:pointer;
  border:1.5px solid var(--rule);background:var(--paper);color:var(--ink)}
.row2 .primary{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:11px;color:var(--ink-soft);text-align:center;padding:14px 4px 0;font-weight:600;line-height:1.6}

/* Coop-Dialog */
.code{font:800 34px/1 "Avenir Next",system-ui,sans-serif;letter-spacing:6px;text-align:center;
  color:var(--ink);background:var(--paper);border:2px dashed var(--rule);border-radius:12px;padding:16px 8px;margin-bottom:12px}
.codein{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:13px;text-align:center;
  font:800 22px inherit;letter-spacing:5px;text-transform:uppercase;color:var(--pencil);background:var(--paper)}
.codein:focus{outline:none;border-color:var(--ink)}
.note{font-size:11.5px;color:var(--ink-soft);font-weight:600;line-height:1.55;margin-top:12px}
.status{font-size:12px;font-weight:700;text-align:center;margin-top:10px;color:var(--ink-soft);min-height:16px}
@media (prefers-reduced-motion:reduce){.sheetbox{transition:none}}
td.cell.need{color:#c8442f}
td.cell.dead{color:#b7bad0}
tr.bonus td.cell,tr.sum td.cell{cursor:pointer}
.bonusbig{font:800 32px/1.1 "Avenir Next",system-ui,sans-serif;text-align:center;color:var(--warn);margin-bottom:4px}
.bonusbig.ok{color:var(--ok)}
.bonusbig.dead{color:var(--ink-soft)}
.bsub{text-align:center;font:700 12.5px inherit;color:var(--ink-soft);margin-bottom:14px}
.blist div{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;
  padding:11px 12px;margin-bottom:7px;font:700 13.5px inherit;color:var(--pencil)}
.blist div span{float:right;color:var(--ink-soft);font-weight:800}

/* ---------- Endstand mit Podest ---------- */
.finalwrap{margin:2px 0 4px}
.finalwrap svg{width:100%;height:auto;display:block}
.franks{margin-top:10px}
.frank{display:flex;align-items:center;gap:10px;border:1.2px solid var(--rule);border-radius:9px;
  padding:8px 12px;margin-bottom:6px;background:var(--card)}
.frank .pl{font:800 12px inherit;color:var(--ink-soft);min-width:16px}
.frank .nm{flex:1;min-width:0;font:700 13.5px inherit;color:var(--pencil);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frank .pt{font:800 14px inherit;color:var(--ink)}

/* ---------- Farben für die Spalten ---------- */
body.tint tr:not(.sum):not(.total) td.cell.p0{background:#eaf1fb}
body.tint tr:not(.sum):not(.total) td.cell.p1{background:#f7eef6}
body.tint tr:not(.sum):not(.total) td.cell.p2{background:#eaf6ee}
body.tint tr:not(.sum):not(.total) td.cell.p3{background:#fdf3e6}
body.tint tr:not(.sum):not(.total) td.cell.p4{background:#efedfa}
body.tint tr:not(.sum):not(.total) td.cell.p5{background:#fdedef}
body.tint th.pcol.p0{background:#dfe9f7}
body.tint th.pcol.p1{background:#f1e4ef}
body.tint th.pcol.p2{background:#dff0e5}
body.tint th.pcol.p3{background:#f9e9d5}
body.tint th.pcol.p4{background:#e6e2f5}
body.tint th.pcol.p5{background:#f9e0e4}
.mini .now.off{color:var(--ink-soft);opacity:.7}

/* ---------- Hinweis auf eine neue Version ---------- */
#upbar{display:none;align-items:center;gap:10px;margin:0 2px 8px;padding:9px 12px;
  background:var(--ink);color:#fff;border-radius:10px;flex:0 0 auto}
#upbar.on{display:flex}
#upbar .t{flex:1;min-width:0;font:700 11.5px inherit;line-height:1.4}
#upbar .t b{display:block;font-size:12.5px;font-weight:800}
#upbar .t i{font-style:normal;opacity:.75}
#upbar button{border:none;background:#fff;color:var(--ink);border-radius:8px;
  padding:9px 13px;font:800 12.5px inherit;cursor:pointer;flex:0 0 auto}

/* ---------- Zum Aktualisieren ziehen ---------- */
#pullbar{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 6px);z-index:15;
  display:flex;justify-content:center;pointer-events:none;opacity:0;
  transform:translateY(-14px);transition:opacity .15s ease}
#pullbar span{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;
  border-radius:999px;padding:7px 14px;font:700 12px inherit;
  box-shadow:0 4px 14px rgba(40,42,70,.28)}
#pullbar i{width:9px;height:9px;border-radius:50%;border:2px solid rgba(255,255,255,.45);
  border-top-color:#fff;display:none}
#pullbar.busy i{display:block;animation:spin .7s linear infinite}
#pullbar.snap{transition:transform .25s ease, opacity .2s ease}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Würfelbrett ---------- */
.sheetbox{max-height:94vh;overflow-y:auto}
.board{position:relative;width:100%;max-width:330px;margin:0 auto 6px;touch-action:none;
  perspective:760px;perspective-origin:50% 34%}
.board svg.hex{position:absolute;left:0;top:0;filter:drop-shadow(0 6px 14px rgba(30,32,60,.28))}
.cup{position:absolute;border-radius:16px;border:2px dashed transparent;transition:border-color .15s}
.cup.over{border-color:#c9a24a}
.cup svg{position:absolute;inset:0;width:100%;height:100%}
.cupg{transform-box:fill-box;transform-origin:50% 16%}
.cupg.pour{animation:pour .52s cubic-bezier(.3,.6,.4,1)}
@keyframes pour{0%{transform:rotate(0)}18%{transform:rotate(11deg)}
  52%{transform:rotate(-54deg)}78%{transform:rotate(-41deg)}100%{transform:rotate(0)}}
.caption{position:absolute;font:700 10.5px inherit;color:var(--ink-soft);text-align:center;width:100%}

.wd{position:absolute;left:0;top:0;width:42px;height:42px;transform-style:preserve-3d;cursor:grab}
.wd.grab{z-index:9;cursor:grabbing}
.sh{position:absolute;left:5px;top:31px;width:32px;height:10px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(12,14,30,.5) 0%,rgba(12,14,30,0) 72%)}
.body{position:absolute;inset:0;transform-style:preserve-3d}
.f{position:absolute;backface-visibility:hidden}

.f6{width:42px;height:42px;background-size:100% 100%}
.f10{backface-visibility:hidden;box-shadow:inset 0 0 0 .9px rgba(120,8,20,.9)}
.f10 b{position:absolute;left:0;right:0;font:800 13.5px "Avenir Next",system-ui,sans-serif;
  color:#fff;text-align:center;letter-spacing:.5px;text-shadow:0 1px 2px rgba(80,0,8,.8)}

.ring{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;
  border:2px solid rgba(255,255,255,.7);opacity:0;pointer-events:none}
.ring.go{animation:ripple .42s ease-out}
@keyframes ripple{0%{opacity:.85;transform:scale(.3)}100%{opacity:0;transform:scale(2.6)}}

.dicehint{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;margin:8px 0 10px}
.plrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.plrow::-webkit-scrollbar{display:none}
.plrow button{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:6px 12px;font:700 12px inherit;cursor:pointer}
.plrow button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sugg{max-height:34vh;overflow-y:auto;margin-top:4px}
.sugg button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;
  background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:10px 12px;
  margin-bottom:6px;font:inherit;cursor:pointer;text-align:left}
.sugg button.top{border-color:var(--ink);background:#eef0fa}
.sugg .nm{font:700 13.5px inherit;color:var(--pencil)}
.sugg .ex{display:block;font:600 10.5px inherit;color:var(--ink-soft);margin-top:1px}
.sugg .pt{font:800 16px inherit;color:var(--ink);flex:0 0 auto}
.sugg .pt.nil{color:#b7bad0;font-size:13px}
#diceStrip{display:flex;align-items:center;gap:8px;margin:0 4px 8px;padding:7px 10px;
  border:1.5px solid var(--live);border-radius:10px;background:#eefaf4}
#diceStrip .who{font:700 11.5px inherit;color:var(--ok);flex:0 0 auto}
#diceStrip .mini{display:flex;gap:3px;flex-wrap:wrap;flex:1}
#diceStrip .x{border:none;background:none;color:var(--ok);font:800 15px inherit;
  line-height:1;padding:2px 4px;cursor:pointer;flex:0 0 auto;opacity:.7}
#diceStrip .mini span{min-width:17px;height:19px;border-radius:4px;border:1px solid var(--rule);
  background:var(--card);font:800 11px/17px inherit;text-align:center;color:var(--pencil)}
#diceStrip .mini span.x{border-radius:50%;background:var(--paper)}
footer .val{font-size:16px}
footer button{padding:9px 9px;font-size:12.5px}
#diag{margin-top:12px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:10px;
  background:var(--paper);font:600 11.5px/1.7 ui-monospace,Menlo,monospace;color:var(--ink-soft)}

/* ---------- Breite Geräte: alles auf eine Mittelachse ---------- */
@media (min-width:760px){
  header.sheet-head{justify-content:center;gap:18px}
  .mini, .coopbar, .tabs{justify-content:center}
  footer .fin{max-width:600px}
  .hint{text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="mini">
    <button class="now" id="sheetNow">Blatt 1</button>
    <button class="now off" id="tintBtn">Farben</button>
    <button class="now" id="standBtn">Stand</button>
  </div>

  <div id="upbar">
    <span class="t"><b>Neue Version verfügbar</b>
      <i>Punkte und Blätter bleiben erhalten</i></span>
    <button id="upBtn">Neu laden</button>
  </div>

  <div class="bighead" id="bighead">
    <header class="sheet-head">
      <div class="logo"><b>Würfelblock</b><span style="font-size:16px">Extreme</span>
        <small>6 WÜRFEL · BIS 6 SPIELER</small></div>
    </header>
    <div class="coopbar">
      <button id="coopChip"><span class="dot"></span><span id="coopText">Nur dieses Handy</span></button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div id="diceStrip" style="display:none"></div>
  <div class="scroller">
    <table id="grid"></table>
    <p class="hint">Feld antippen zum Eintragen · Summen rechnen sich selbst<br>
       Jedes Gerät darf jede Spalte pflegen<br>
       <span id="ver" style="opacity:.65"></span><br>
       <span class="byfoot">App by <b>Felix</b></span></p>
  </div>
</div>

<footer><div class="fin">
  <div>
    <div class="lead-l" id="footLabel">FÜHRT</div>
    <div class="val" id="footVal">—</div>
  </div>
  <div class="btns">
    <button class="primary" id="diceBtn">Würfeln</button>
    <button id="newSheet">+ Blatt</button>
    <button id="clearSheet">Leeren</button>
  </div>
</div></footer>

<div id="pullbar"><span><i></i><b id="pulltext">Aktualisieren</b></span></div>
<div class="veil" id="veil"></div>
<div class="sheetbox" id="sheetbox">
  <h3 id="sbTitle">—</h3>
  <div class="sub" id="sbSub">—</div>
  <div id="sbBody"></div>
  <div class="row2" id="sbFoot">
    <button id="sbClear">Feld leeren</button>
    <button class="primary" id="sbClose">Fertig</button>
  </div>
</div>

<script>
const VERSION = 'v54 · 27.08.2026';   /* zum Vergleichen zwischen den Handys */
/* ======================= Zeilen des Blocks ======================= */
const MAXP = 6;
const ROWS = [
  {id:'e1', kind:'count', die:1, name:'nur Einser',  hint:'zählen'},
  {id:'e2', kind:'count', die:2, name:'nur Zweier',  hint:'zählen'},
  {id:'e3', kind:'count', die:3, name:'nur Dreier',  hint:'zählen'},
  {id:'e4', kind:'count', die:4, name:'nur Vierer',  hint:'zählen'},
  {id:'e5', kind:'count', die:5, name:'nur Fünfer',  hint:'zählen'},
  {id:'e6', kind:'count', die:6, name:'nur Sechser', hint:'zählen'},
  {id:'upperSum', kind:'calc', name:'gesamt', hint:'→'},
  {id:'bonus',    kind:'calc', name:'noch bis 73', hint:'Bonus plus 45'},
  {id:'upperTot', kind:'calc', name:'gesamt oberer Teil', hint:'→'},
  {id:'__gap',    kind:'gap'},
  {id:'l1',  kind:'sum',   max:39, name:'Dreierpasch',       hint:'alle Augen zählen'},
  {id:'l2',  kind:'sum',   max:39, name:'Viererpasch',       hint:'alle Augen zählen'},
  {id:'l3',  kind:'sum',   max:39, name:'Zwei Paare',        hint:'alle Augen zählen'},
  {id:'l4',  kind:'fixed', pts:35, name:'Drei Paare',        hint:'35 Punkte'},
  {id:'l5',  kind:'fixed', pts:45, name:'Zwei Dreier',       hint:'45 Punkte'},
  {id:'l6',  kind:'fixed', pts:25, name:'Full-House',        hint:'25 Punkte'},
  {id:'l7',  kind:'fixed', pts:45, name:'Großes Full-House', hint:'45 Punkte'},
  {id:'l8',  kind:'fixed', pts:30, name:'Kleine Straße',     hint:'30 Punkte'},
  {id:'l9',  kind:'fixed', pts:40, name:'Große Straße',      hint:'40 Punkte'},
  {id:'l10', kind:'fixed', pts:50, name:'Highway',           hint:'50 Punkte'},
  {id:'l11', kind:'fixed', pts:50, name:'Kniffel',           hint:'50 Punkte'},
  {id:'l12', kind:'fixed', pts:75, name:'Kniffel Extreme',   hint:'75 Punkte'},
  {id:'l13', kind:'fixed', pts:40, name:'10 oder weniger',   hint:'40 Punkte'},
  {id:'l14', kind:'fixed', pts:40, name:'33 oder mehr',      hint:'40 Punkte'},
  {id:'l15', kind:'sum',   max:39, name:'Chance',            hint:'alle Augen zählen'},
  {id:'l16', kind:'sum2',  max:39, name:'Super Chance',      hint:'alle Augen zählen ×2'},
  {id:'lowerTot', kind:'calc', name:'gesamt unterer Teil', hint:'→'},
  {id:'upperTot2',kind:'calc', name:'gesamt oberer Teil',  hint:'→'},
  {id:'endTotal', kind:'calc', name:'Endsumme', hint:'→', total:true}
];
const UPPER  = ['e1','e2','e3','e4','e5','e6'];
const LOWERR = ROWS.filter(r=>['sum','sum2','fixed'].includes(r.kind));

/* ======================= Zustand ======================= */
let lastT = 0;
const now = () => { const t = Math.max(Date.now(), lastT+1); lastT = t; return t; };
const rid = () => Math.random().toString(36).slice(2,9);
/* Gerätekennung bleibt erhalten – sie entscheidet bei gleichem Zeitstempel */
const DEV = (()=>{ try{ let v=localStorage.getItem('kniffel-dev');
  if(!v){ v=rid()+rid().slice(0,3); localStorage.setItem('kniffel-dev',v); } return v; }
  catch(e){ return rid(); } })();
const stamp = v => ({v, t:now(), d:DEV});

const newPlayer = (name='') => ({id:rid(), created:now(), name:stamp(name), del:{v:0,t:0}});
const newSheet  = (names=['','']) => ({id:rid(), created:now(), del:{v:0,t:0},
                                       players:names.map(n=>newPlayer(n)), cells:{}});

let state = {activeId:null, sheets:[newSheet()]};
state.activeId = state.sheets[0].id;

const liveSheets  = () => state.sheets.filter(s=>!s.del.v);
const sheet = () => liveSheets().find(s=>s.id===state.activeId) || liveSheets()[0];
const livePlayers = s => s.players.filter(p=>!p.del.v);
const ck = (pid,row) => pid+'~'+row;
const cellV = (s,pid,row) => { const c = s.cells[ck(pid,row)]; return c ? c.v : null; };
const setCell = (s,pid,row,v) => { s.cells[ck(pid,row)] = stamp(v); };

/* ======================= Rechnen ======================= */
function calc(pid){
  const s = sheet(); if(!s) return {};
  let upper=0, upperAny=false;
  UPPER.forEach(id=>{ const v=cellV(s,pid,id); if(v!==null&&v!==undefined){upper+=v;upperAny=true;} });
  const bonus = upper>=73 ? 45 : 0;
  let lower=0, lowerAny=false;
  LOWERR.forEach(r=>{ const v=cellV(s,pid,r.id); if(v!==null&&v!==undefined){lower += r.kind==='sum2'?v*2:v; lowerAny=true;} });
  return {upperSum:upperAny?upper:null, bonus:upperAny?bonus:null, upperTot:upperAny?upper+bonus:null,
          lowerTot:lowerAny?lower:null, endTotal:(upperAny||lowerAny)?(upper+bonus+lower):null};
}

/* =============== Bonus bei 73: was fehlt, und wie man hinkommt =============== */
const ZAHL = ['','Einser','Zweier','Dreier','Vierer','Fünfer','Sechser'];
function bonusInfo(pid){
  const s = sheet(); let sum=0, any=false; const open=[];
  UPPER.forEach((id,i)=>{
    const v = cellV(s,pid,id);
    if (v===null||v===undefined) open.push(i+1); else { sum+=v; any=true; }
  });
  const need = Math.max(0, 73-sum);
  const max  = open.reduce((a,v)=>a+6*v, 0);
  const state = need===0 ? 'ok' : !any ? 'idle' : max<need ? 'dead' : 'open';
  return {sum, need, open, max, state};
}
/* Alle Kombinationen aus den offenen Zahlen durchgehen und die
   sparsamsten bzw. gleichmäßigsten Wege heraussuchen. */
function bonusWays(open, need){
  const all = [];
  (function rec(i, counts, sum, dice){
    if (i === open.length){
      if (sum>=need) all.push({counts:[...counts], sum, dice, spread:Math.max(...counts)});
      return;
    }
    for (let n=0; n<=6; n++){ counts.push(n); rec(i+1, counts, sum+n*open[i], dice+n); counts.pop(); }
  })(0, [], 0, 0);
  if (!all.length) return [];
  const fmt = w => open.map((v,i)=>w.counts[i]?`${w.counts[i]}× ${ZAHL[v]}`:null).filter(Boolean).join(' · ');
  const byDice   = [...all].sort((a,b)=>a.dice-b.dice || a.spread-b.spread || a.sum-b.sum)[0];
  const bySpread = [...all].sort((a,b)=>a.spread-b.spread || a.dice-b.dice || a.sum-b.sum)[0];
  const out = [];
  const add = w => { const t=fmt(w); if(t && !out.some(o=>o.t===t)) out.push({t, sum:w.sum}); };
  add(byDice); add(bySpread);
  return out;
}
function openBonus(pid){
  const p = livePlayers(sheet()).find(x=>x.id===pid); if(!p) return;
  const b = bonusInfo(pid);
  mode='bonus'; sbFoot.style.display='none';
  document.getElementById('sbTitle').textContent = 'Bonus bei 73';
  document.getElementById('sbSub').textContent = (p.name.v || 'Spieler') + ' · oberer Teil';
  let body;
  if (b.state==='ok'){
    body = `<div class="bonusbig ok">geschafft</div>
      <div class="bsub">${b.sum} Punkte oben · die 45 sind sicher</div>`;
  } else if (b.state==='dead'){
    body = `<div class="bonusbig dead">nicht mehr</div>
      <div class="bsub">Du stehst bei ${b.sum}. Offen sind höchstens ${b.max} Punkte,
        nötig wären noch ${b.need}.</div>`;
  } else if (b.state==='idle'){
    body = `<div class="bonusbig">73</div>
      <div class="bsub">Noch nichts eingetragen. Drei Gleiche von jeder Zahl bringen 63 –
        für den Bonus brauchst du bei einigen Zahlen den vierten Würfel.</div>`;
  } else {
    const ways = bonusWays(b.open, b.need);
    const offen = b.open.map(v=>ZAHL[v]).join(', ');
    body = `<div class="bonusbig">noch ${b.need}</div>
      <div class="bsub">${b.sum} von 73 · offen: ${offen}</div>
      <div class="blist">${ways.map(w=>`<div>${w.t}<span>${w.sum}</span></div>`).join('')}</div>
      <div class="note">Drei Gleiche von jeder Zahl bringen nur 63 – für den Bonus
        brauchst du bei einigen Zahlen den vierten Würfel.</div>`;
  }
  sbBody.innerHTML = body + `<div class="row2"><button class="primary" id="doneBtn">Fertig</button></div>`;
  openBox();
}

/* ======================= Tabelle ======================= */
const grid = document.getElementById('grid');
/* Drei kleine Würfel, die wirklich die Augenzahl der Zeile zeigen */
const DPOS = [3.2, 6, 8.8];
const pips = v => {
  const dots = (PIPS[v]||[])
    .map(k=>`<circle cx="${DPOS[k%3]}" cy="${DPOS[(k/3)|0]}" r="1.05" fill="#5a5e8c"/>`).join('');
  const die = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">`
    + `<rect x=".6" y=".6" width="10.8" height="10.8" rx="2.4" fill="#fff" `
    + `stroke="#8589b0" stroke-width="1"/>${dots}</svg>`;
  return `<span class="dice">${die.repeat(3)}</span>`;
};
const esc  = s => (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

function buildTable(){
  const s = sheet(); if(!s) return;
  const ps = livePlayers(s);
  let h = '<thead><tr><th class="lbl">NAME</th>';
  ps.forEach((p,i)=>{
    h += `<th class="pcol p${i}">${ps.length>1?`<button class="kill" data-kill="${p.id}">✕</button>`:''}
      <input type="text" data-name="${p.id}" value="${esc(p.name.v)}" placeholder="Spieler ${i+1}" autocomplete="off"></th>`;
  });
  if (ps.length < MAXP) h += '<th class="addcol"><button id="addP">+</button></th>';
  h += '</tr></thead><tbody>';
  ROWS.forEach(r=>{
    if (r.kind==='gap') return;                 // keine Leerzeile mehr, siehe .sep
    const sep = r.id==='l1' ? ' sep' : '';       // Trennlinie zum unteren Teil
    h += `<tr class="${r.total?'total':(r.kind==='calc'?'sum':'')}${r.id==='bonus'?' bonus':''}${sep}">`;
    h += `<td class="lbl"><span class="n">${r.name}</span>`;
    h += r.kind==='count'
       ? `<span class="h d">${pips(r.die)}${r.hint}</span>`
       : (r.hint?`<span class="h">${r.hint}</span>`:'');
    h += '</td>';
    ps.forEach((p,i) => h += `<td class="cell p${i}" data-row="${r.id}" data-p="${p.id}"></td>`);
    if (ps.length < MAXP) h += '<td class="pad"></td>';
    h += '</tr>';
  });
  grid.innerHTML = h + '</tbody>';
}

let lastSig = '', src = 'mine';
/* Kurz aufleuchten lassen: eigene Eintraege dezent, fremde deutlich */
function highlight(td){
  const cls = src==='theirs' ? 'hl-theirs' : 'hl-mine';
  td.classList.remove('hl-mine','hl-theirs');
  void td.offsetWidth;                 // Animation neu starten
  td.classList.add(cls);
  setTimeout(()=>td.classList.remove(cls), cls==='hl-theirs'?4600:1200);
}
function render(){
  const s = sheet(); if(!s) return;
  const ps = livePlayers(s);
  const sig = ps.map(p=>p.id).join(',')+'|'+s.id;
  const fresh = sig !== lastSig;
  if (fresh){ buildTable(); lastSig = sig; }

  let best=-1, bestVal=null;
  ps.forEach(p=>{ const e=calc(p.id).endTotal; if(e!==null&&(bestVal===null||e>bestVal)){bestVal=e;best=p.id;} });
  const tie = ps.filter(p=>calc(p.id).endTotal===bestVal).length>1;

  ROWS.forEach(r=>{
    ps.forEach(p=>{
      const td = grid.querySelector(`td.cell[data-row="${r.id}"][data-p="${p.id}"]`);
      if (!td) return;
      let html;
      if (r.id==='bonus'){
        const b = bonusInfo(p.id);
        html = b.state==='ok' ? '+45' : b.state==='dead' ? '<span class="zero">—</span>'
             : b.state==='open' ? String(b.need) : '';
        td.classList.toggle('hit',  b.state==='ok');
        td.classList.toggle('need', b.state==='open');
        td.classList.toggle('dead', b.state==='dead');
      } else if (r.kind==='calc'){
        const c = calc(p.id);
        const v = c[r.id==='upperTot2'?'upperTot':r.id];
        html = v===null?'':String(v);
        if (r.total) td.classList.toggle('lead', !tie && p.id===best && bestVal!==null);
      } else {
        const v = cellV(s,p.id,r.id);
        const n = (v===null||v===undefined) ? null : Number(v);
        html = (n===null||!isFinite(n)) ? '' :
               n===0 ? '<span class="zero">—</span>' :
               r.kind==='sum2' ? `${n*2}<span class="dbl">${n}×2</span>` : String(n);
      }
      if (td.innerHTML !== html){
        td.innerHTML = html;
        if (!fresh && r.kind!=='calc' && html!=='') highlight(td);
      }
    });
  });

  /* Namensfelder mitziehen, wenn ein anderes Gerät sie ändert.
     Wer gerade selbst tippt, wird dabei nicht unterbrochen. */
  ps.forEach(p=>{
    const inp = grid.querySelector(`th.pcol input[data-name="${p.id}"]`);
    if (inp && document.activeElement!==inp && inp.value!==p.name.v) inp.value = p.name.v;
  });
  const nm = id => { const p = ps.find(x=>x.id===id); return p ? (p.name.v || 'Spieler') : ''; };
  const fl = document.getElementById('footLabel'), fv = document.getElementById('footVal');
  if (bestVal===null){ fl.textContent='FÜHRT'; fv.textContent='—'; }
  else if (tie){ fl.textContent='GLEICHSTAND'; fv.textContent=bestVal; }
  else { fl.textContent='FÜHRT'; fv.textContent = nm(best)+' · '+bestVal; }
  const offen = missingCount(s);
  if (!offen) fl.textContent='ENDSTAND ANSEHEN';
  else if (bestVal!==null) fl.textContent='FÜHRT · NOCH '+offen;
  const sb=document.getElementById('standBtn');
  if (sb) sb.textContent = offen ? 'Stand · '+offen : 'Endstand';

  renderTabs();
  refreshFinal();
}

function renderTabs(){
  const ls = liveSheets();
  document.getElementById('tabs').innerHTML =
    ls.map((s,i)=>`<button class="tab ${s.id===sheet().id?'on':''}" data-i="${s.id}">Blatt ${i+1}</button>`).join('')
    + '<button class="tab add" data-add="1">+ Blatt</button>'
    + (ls.length>1?'<button class="tab" data-del="1">Blatt löschen</button>':'');
  const now = document.getElementById('sheetNow');
  if (now){
    const i = ls.findIndex(s=>s.id===sheet().id);
    now.textContent = 'Blatt '+(i+1)+(ls.length>1?' / '+ls.length:'');
  }
}

/* Sobald jedes Feld jeder Spalte gefüllt ist, ist das Blatt fertig.
   Das erkennt jedes Gerät für sich – die Daten sind ja überall dieselben. */
const ENTRYROWS = ROWS.filter(r=>['count','sum','sum2','fixed'].includes(r.kind));
function sheetDone(s){
  const ps=livePlayers(s);
  if(!ps.length) return false;
  return ps.every(p=>ENTRYROWS.every(r=>{ const v=cellV(s,p.id,r.id); return v!==null&&v!==undefined; }));
}
function missingCount(s){
  let n=0;
  livePlayers(s).forEach(p=>ENTRYROWS.forEach(r=>{
    const v=cellV(s,p.id,r.id); if(v===null||v===undefined) n++; }));
  return n;
}
function missingList(s){
  return livePlayers(s).map(p=>({
    nm: p.name.v||'Spieler',
    rows: ENTRYROWS.filter(r=>{ const v=cellV(s,p.id,r.id); return v===null||v===undefined; })
  })).filter(x=>x.rows.length);
}
/* Erwartungswert und Streuung je Kästchen, ausgewürfelt mit je 120000 Partien
   und einer einfachen Halte-Strategie. Grundlage der Gewinnchance. */
const ODDS = {e1:[2.38,1.19], e2:[4.76,2.38], e3:[7.12,3.55], e4:[9.51,4.77], e5:[11.89,5.94], e6:[14.27,7.14], l1:[19.48,10.24], l2:[9.88,12.34], l3:[14.58,11.35], l4:[0.78,5.17], l5:[2.86,10.97], l6:[12.79,12.5], l7:[4.41,13.38], l8:[18.33,14.63], l9:[14.0,19.08], l10:[7.17,17.52], l11:[5.96,16.21], l12:[0.99,8.57], l13:[6.93,15.14], l14:[10.3,17.49], l15:[29.48,4.25], l16:[58.96,8.48]};
const CAPS = (()=>{ const c={};
  ROWS.forEach(r=>{ if(r.kind==='count') c[r.id]=6*r.die;
    else if(r.kind==='fixed') c[r.id]=r.pts;
    else if(r.kind==='sum') c[r.id]=39; else if(r.kind==='sum2') c[r.id]=78; });
  return c; })();
let gaussSpare=null;
function gauss(){                       // Standardnormalverteilung, Box-Muller
  if(gaussSpare!==null){ const v=gaussSpare; gaussSpare=null; return v; }
  let u=0,v=0,s=0;
  do{ u=Math.random()*2-1; v=Math.random()*2-1; s=u*u+v*v; }while(s===0||s>=1);
  const f=Math.sqrt(-2*Math.log(s)/s); gaussSpare=v*f; return u*f;
}
let oddsCache={key:'', val:null};
/* Zehntausend gedachte Partien: was noch offen ist, wird ausgewürfelt,
   was schon steht, bleibt. Wie oft gewinnt wer? */
function winChances(sims){
  const s=sheet(), ps=livePlayers(s);
  if(ps.length<2) return null;
  const key = canon(state.sheets)+'|'+ps.length;
  if(oddsCache.key===key) return oddsCache.val;
  const N = sims || 4000;
  const spieler = ps.map(p=>{
    let curUp=0, curLow=0; const offUp=[], offLow=[];
    ROWS.forEach(r=>{
      if(!['count','sum','sum2','fixed'].includes(r.kind)) return;
      const v=cellV(s,p.id,r.id);
      const gefuellt = v!==null && v!==undefined;
      if(UPPER.includes(r.id)){ gefuellt ? curUp+=v : offUp.push(r.id); }
      else { gefuellt ? curLow+=(r.kind==='sum2'?v*2:v) : offLow.push(r.id); }
    });
    return {id:p.id, nm:p.name.v||'Spieler', curUp, curLow, offUp, offLow};
  });
  const wins = spieler.map(()=>0);
  const zieh = id => {
    const o=ODDS[id]; if(!o) return 0;
    return Math.max(0, Math.min(CAPS[id]||0, Math.round(o[0]+gauss()*o[1])));
  };
  for(let n=0;n<N;n++){
    let best=-1, gew=[];
    for(let i=0;i<spieler.length;i++){
      const x=spieler[i];
      let up=x.curUp; x.offUp.forEach(id=>up+=zieh(id));
      let low=x.curLow; x.offLow.forEach(id=>low+=zieh(id));
      const total = up + (up>=73?45:0) + low;
      if(total>best){ best=total; gew=[i]; } else if(total===best) gew.push(i);
    }
    gew.forEach(i=>wins[i]+=1/gew.length);
  }
  const val = spieler.map((x,i)=>({id:x.id, nm:x.nm, pct: wins[i]/N}));
  oddsCache={key, val};
  return val;
}

/* Wer hat welches abgeschlossene Blatt gewonnen? Gezählt wird über den Namen,
   denn jedes Blatt hat eigene Spielerkennungen. */
function sheetWinners(s){
  const ps=livePlayers(s);
  if(!ps.length || !sheetDone(s)) return [];
  const tot=ps.map(p=>{
    let up=0, low=0;
    ROWS.forEach(r=>{
      if(!['count','sum','sum2','fixed'].includes(r.kind)) return;
      const v=cellV(s,p.id,r.id)||0;
      if(UPPER.includes(r.id)) up+=v; else low+=(r.kind==='sum2'?v*2:v);
    });
    return {nm:p.name.v||'Spieler', pts:up+(up>=73?45:0)+low};
  });
  const best=Math.max(...tot.map(x=>x.pts));
  return tot.filter(x=>x.pts===best).map(x=>x.nm);
}
function seriesWins(){
  const w={};
  liveSheets().forEach(s=>sheetWinners(s).forEach(nm=>{ w[nm]=(w[nm]||0)+1; }));
  return w;
}
function standings(){
  const s=sheet();
  const list=livePlayers(s).map(p=>({id:p.id, nm:p.name.v||'Spieler', pts:calc(p.id).endTotal||0}))
    .sort((a,b)=>b.pts-a.pts);
  let rank=0, prev=null;
  list.forEach((x,i)=>{ if(x.pts!==prev){ rank=i+1; prev=x.pts; } x.rank=rank; });
  return list;
}
const FCOL={1:'#c9a227',2:'#98a0bb',3:'#b3763f'};
/* Was ist theoretisch überhaupt drin? Oben sechs Würfel je Zahl plus Bonus,
   unten jeweils der Höchstwert des Kästchens. Ergibt 880. */
const MAXPTS = (()=>{
  const augen = 5*6+9;                                  // größte Augensumme
  let m = 6*(1+2+3+4+5+6) + 45;                         // oberer Teil samt Bonus
  ROWS.forEach(r=>{
    if(r.kind==='fixed') m += r.pts;
    else if(r.kind==='sum')  m += augen;
    else if(r.kind==='sum2') m += augen*2;
  });
  return m;
})();
/* Siegsterne: bis drei nebeneinander, vier als Viereck, fünf als zwei über drei,
   ab sechs die Zahl mit einem Stern – so bleibt es auch bei sechs Spalten lesbar. */
function sternForm(cx,cy,r){
  let pts=[];
  for(let i=0;i<10;i++){
    const a=-Math.PI/2 + i*Math.PI/5, rr=i%2===0?r:r*0.45;
    pts.push((cx+rr*Math.cos(a)).toFixed(2)+','+(cy+rr*Math.sin(a)).toFixed(2));
  }
  return `<polygon points="${pts.join(' ')}" fill="${FCOL[1]}"/>`;
}
function sterne(n,cx,cy){
  const r=4.2, d=2*r+2;
  if(n>=6) return `<text x="${cx-6}" y="${cy+4}" font-size="11" font-weight="800" `
    + `fill="${FCOL[1]}" text-anchor="end">${n}</text>` + sternForm(cx+1.5,cy,r);
  if(n<=3){ const x0=cx-(n-1)*d/2; let s='';
    for(let i=0;i<n;i++) s+=sternForm(x0+i*d,cy,r); return s; }
  if(n===4){ let s='';
    for(let i=0;i<4;i++) s+=sternForm(cx+((i%2)-0.5)*d, cy+(Math.floor(i/2)-0.5)*d, r); return s; }
  return sternForm(cx-d/2,cy-d/2,r)+sternForm(cx+d/2,cy-d/2,r)
       + sternForm(cx-d,cy+d/2,r)+sternForm(cx,cy+d/2,r)+sternForm(cx+d,cy+d/2,r);
}
function podiumSVG(list, siege){
  const W=360, n=list.length, axis=30, padr=12, gap=10;
  const bw=Math.min(64,(W-axis-padr-(n-1)*gap)/n);
  const total=n*bw+(n-1)*gap, x0=axis+(W-axis-padr-total)/2;
  const TOP=52, BH=178, BASE=TOP+BH, best=list[0].pts;
  const cap=(x,y,w,hh,r)=>{ r=Math.min(r,w/2,hh);
    return `M${x} ${y+hh} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-r} ${y} `
         + `Q${x+w} ${y} ${x+w} ${y+r} L${x+w} ${y+hh} Z`; };
  let P='';
  [[0.5,''],[1,'']].forEach(([q])=>{
    const y=BASE-BH*q;
    P+=`<line x1="${axis-4}" y1="${y.toFixed(1)}" x2="${W-padr}" y2="${y.toFixed(1)}" stroke="var(--rule)" `
     + `stroke-width="1" stroke-dasharray="3 5" opacity="${q===1?0.85:0.5}"/>`
     + `<text x="${axis-8}" y="${(y+3).toFixed(1)}" font-size="8.5" font-weight="700" `
     + `fill="var(--ink-soft)" text-anchor="end">${Math.round(MAXPTS*q)}</text>`;
  });
  const yb=BASE-BH*Math.min(1,best/MAXPTS);
  P+=`<line x1="${axis-4}" y1="${yb.toFixed(1)}" x2="${W-padr}" y2="${yb.toFixed(1)}" stroke="${FCOL[1]}" `
   + `stroke-width="1.2" stroke-dasharray="2 4" opacity=".8"/>`
   + `<text x="${axis-8}" y="${(yb+3).toFixed(1)}" font-size="8.5" font-weight="800" fill="${FCOL[1]}" `
   + `text-anchor="end">${best}</text>`;
  list.forEach((x,i)=>{
    const bx=x0+i*(bw+gap), cx=bx+bw/2;
    const col=FCOL[x.rank]||'#6f74a3';
    const hp=Math.max(8, BH*Math.min(1,x.pts/MAXPTS)), y=BASE-hp;
    P+=`<path d="${cap(bx,TOP,bw,BH,8)}" fill="var(--paper)" stroke="var(--rule)" stroke-width="1" opacity=".75"/>`
     + `<path d="${cap(bx,y,bw,hp,8)}" fill="var(--ink)"/>`
     + `<path d="${cap(bx,y,bw,Math.min(hp,9),8)}" fill="${col}"/>`
     + `<text x="${cx}" y="${(y-8).toFixed(1)}" font-size="12.5" font-weight="800" fill="var(--ink)" text-anchor="middle">${x.pts}</text>`
     + `<text x="${cx}" y="${(BASE-9).toFixed(1)}" font-size="10" font-weight="800" fill="#fff" opacity=".55" text-anchor="middle">${x.rank}</text>`
     + `<text x="${cx}" y="${(BASE+16).toFixed(1)}" font-size="11" font-weight="800" fill="var(--pencil)" text-anchor="middle">${esc(x.nm).slice(0,8)}</text>`
     + `<text x="${cx}" y="${(BASE+28).toFixed(1)}" font-size="9" font-weight="700" fill="var(--ink-soft)" text-anchor="middle">${Math.round(x.pts/MAXPTS*100)} %</text>`
     + ((siege&&siege[x.nm]) ? sterne(siege[x.nm], cx, BASE+41) : '');
    if(x.rank===1){
      const s=8, cy=y-23;
      P+=`<path d="M${cx-s} ${cy} L${cx-s} ${cy-0.55*s} L${cx-0.5*s} ${cy-0.12*s} L${cx-0.25*s} ${cy-0.95*s} `
       + `L${cx} ${cy-0.2*s} L${cx+0.25*s} ${cy-0.95*s} L${cx+0.5*s} ${cy-0.12*s} L${cx+s} ${cy-0.55*s} L${cx+s} ${cy} Z" fill="${FCOL[1]}"/>`;
    }
  });
  P+=`<line x1="${axis-4}" y1="${BASE}" x2="${W-padr}" y2="${BASE}" stroke="var(--ink)" stroke-width="2"/>`;
  const viele = siege && Object.values(siege).some(n=>n===4||n===5);
  const hoch = BASE + (siege&&Object.keys(siege).length ? (viele?56:50) : 40);
  return `<svg viewBox="0 0 ${W} ${hoch}" font-family="Avenir Next,system-ui,sans-serif">
    <text x="${axis-8}" y="22" font-size="9.5" font-weight="800" fill="var(--ink-soft)" letter-spacing="1.2"
      >PUNKTE IM VERHÄLTNIS ZUM MAXIMUM (${MAXPTS})</text>${P}</svg>`;
}

                 fill="${FCOL[1]}"/></svg>
             = gewonnene Blätter in dieser Runde</div>` : '');
    })()}
    ${offen?(()=>{
      const ch=winChances(), fehlt={};
      missingList(s).forEach(x=>fehlt[x.nm]=x.rows.length);
      const zeilen = (ch?[...ch].sort((a,b)=>b.pct-a.pct)

      return `<div class="sub" style="margin:14px 0 6px">${

        + `<div class="franks">` + zeilen.map(x=>{
            const q = x.pct===null ? '' : (x.pct>0&&x.pct<0.01 ? '<1' : Math.round(x.pct*100))+' %';
            const off = fehlt[x.nm];
            return `<div class="frank" style="position:relative;overflow:hidden">
              ${x.pct!==null?`<span style="position:absolute;left:0;top:0;bottom:0;
                width:${(x.pct*100).toFixed(1)}%;background:#eef0fa"></span>`:''}
              <span class="nm" style="position:relative">${esc(x.nm)}</span>
              <span class="pt" style="position:relative;font-size:11px;font-weight:700;
                color:var(--ink-soft)">${off===undefined?'fertig':'noch '+off}</span>
              <span class="pt" style="position:relative;min-width:44px;text-align:right">${q}</span>
            </div>`;
          }).join('') + `</div>`;
    })():''}
    ${offen?'':`<div class="franks">`+list.map(x=>
      `<div class="frank"><span class="pl">${x.rank}</span><span class="nm">${esc(x.nm)}</span>
       <span class="pt" style="font-size:12px;color:var(--ink-soft);font-weight:700">${

/* ======================= Würfelbrett ======================= */
/* Fünf Holzwürfel und der zehnseitige Würfel mit 0–9, auf einem Filzbrett */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let boardEl=null, hexEl=null, cupEl=null, cupG=null, cupCap=null;
let dice=[], board=null, lastPid=null;
const newBoard = pid => ({pid, roll:0, busy:false,
  state:Array.from({length:6},()=>({v:null,inCup:true,x:0,y:0,rx:0,ry:0,rz:0}))});

/* ================= Vektorkram ================= */
const sub=(a,b)=>a.map((x,k)=>x-b[k]);
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a.reduce((s,x,k)=>s+x*b[k],0);
const norm=a=>{const l=Math.hypot(...a)||1; return a.map(x=>x/l);};
const rotXY=(a,b,v)=>{            // Rx(a)·Ry(b)·v, Winkel in Grad
  const ar=a*Math.PI/180, br=b*Math.PI/180, [x,y,z]=v;
  const x1=x*Math.cos(br)+z*Math.sin(br), z1=-x*Math.sin(br)+z*Math.cos(br);
  return [x1, y*Math.cos(ar)-z1*Math.sin(ar), y*Math.sin(ar)+z1*Math.cos(ar)];
};
/* Winkelpaar, das eine Richtung zur Kamera (0,0,1) dreht */
function faceCam(n){
  const b=-Math.atan2(n[0],n[2])*180/Math.PI;
  const a=Math.atan2(n[1],Math.hypot(n[0],n[2]))*180/Math.PI;
  return [a,b];
}

/* ================= Echter W10: Pentagonal-Trapezoeder ================= */
/* Zehn Drachenflächen. Bei dieser Ringhöhe liegen alle vier Ecken je Fläche
   exakt in einer Ebene – sonst wäre es kein echter Körper.               */
const C36=Math.cos(Math.PI/5);
const ZP=1.10, ZA=ZP*(1-C36)/(1+C36), RA=1.0, D10S=24;
function d10Faces(){
  const P=(r,deg,y)=>[r*Math.cos(deg*Math.PI/180), y, r*Math.sin(deg*Math.PI/180)];
  const N=[0,-ZP,0], S=[0,ZP,0], A=[], B=[];
  for(let i=0;i<5;i++){ A.push(P(RA,72*i,-ZA)); B.push(P(RA,72*i+36,ZA)); }
  const out=[];
  for(let i=0;i<5;i++){
    out.push({v:[N,A[i],B[i],A[(i+1)%5]]});
    out.push({v:[S,B[i],A[(i+1)%5],B[(i+1)%5]]});
  }
  const F=out.map(f=>{
    const v=f.v.map(p=>p.map(x=>x*D10S));
    const c=[0,1,2].map(k=>v.reduce((s,p)=>s+p[k],0)/4);
    let n=norm(cross(sub(v[1],v[0]),sub(v[2],v[0])));
    if(dot(n,c)<0) n=n.map(x=>-x);                 // Normale nach außen
    const up=norm(sub(v[0],c));                     // Richtung zur Spitze
    const ey=norm(sub(up,n.map(x=>x*dot(up,n)))).map(x=>-x);
    const ex=norm(cross(ey,n));
    const loc=v.map(p=>[dot(sub(p,c),ex), dot(sub(p,c),ey)]);
    return {...f, v, c, n, ex, ey, loc};   // v in Bildpunkten mitgeben
  });
  /* Beschriftung wie beim echten Würfel: gegenüberliegende Flächen ergeben 9 */
  const num=new Array(10).fill(null);
  [0,2,4,6,8].forEach((k,j)=>{
    num[k]=[0,2,4,6,8][j];
    const opp=F.findIndex(g=>Math.hypot(...g.n.map((x,i)=>x+F[k].n[i]))<0.02);
    if(opp>=0) num[opp]=9-num[k];
  });
  F.forEach((f,k)=>f.num=num[k]===null?0:num[k]);
  return F;
}
const D10F=d10Faces();

const D=42, R=D/2, HALF=21, BOX=70;
const slowMo = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=330, HEXH=218, CUPW=92, CUPH=88;
function geo(){
  W=Math.max(240,Math.min(330,(document.body.clientWidth||330)-24));
  HEXH=Math.round(W*0.66);
  SC=Math.max(0.74,Math.min(1,W/330));   // schmale Bildschirme: kleinere Würfel
  DE=D*SC;
  boardEl.style.width=W+'px';
  boardEl.style.height=(HEXH+10+CUPH+14)+'px';
  hexEl.setAttribute('width',W); hexEl.setAttribute('height',HEXH);
  hexEl.setAttribute('viewBox',`0 0 ${W} ${HEXH}`);
  hexEl.innerHTML=`<defs>
      <radialGradient id="feltg" cx=".34" cy=".26" r=".9">
        <stop offset="0" stop-color="#2f7a45"/><stop offset=".5" stop-color="#1f5c33"/>
        <stop offset="1" stop-color="#123c21"/></radialGradient>
    </defs>
    <polygon points="${hx(hexPts())}" fill="#e6cfa4" stroke="#9c7c46" stroke-width="1.2" stroke-linejoin="round"/>
    ${woodSegs()}
    <polygon points="${hx(hexPts(0.80))}" fill="url(#feltg)"/>

      stroke-linejoin="round" opacity=".55"/>

/* Regelmäßiges Achteck im Rechteck W x HEXH */
function hexPts(s){
  const cx=W/2, cy=HEXH/2, k=s||1, ax=0.293*W, ay=0.293*HEXH;
  return [[ax,2],[W-ax,2],[W-2,ay],[W-2,HEXH-ay],[W-ax,HEXH-2],[ax,HEXH-2],[2,HEXH-ay],[2,ay]]
    .map(([x,y])=>[cx+(x-cx)*k, cy+(y-cy)*k].map(n=>Math.round(n*10)/10));
}
const hx=v=>v.map(a=>a.join(',')).join(' ');
function mix(a,b,t){
  const p=c=>[1,3,5].map(i=>parseInt(c.substr(i,2),16));
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const q=n=>Math.round(n).toString(16).padStart(2,'0');
  return '#'+q(r1+(r2-r1)*t)+q(g1+(g2-g1)*t)+q(b1+(b2-b1)*t);
}
/* Acht Holzleisten, jede nach Lichteinfall von links oben eigen schattiert */
function woodSegs(){
  const O=hexPts(1), I=hexPts(0.80); let s='';
  for(let i=0;i<8;i++){
    const j=(i+1)%8;
    const mx=(O[i][0]+O[j][0])/2-W/2, my=(O[i][1]+O[j][1])/2-HEXH/2;
    const L=Math.hypot(mx,my)||1;
    const t=Math.max(0,Math.min(1, 0.5-0.52*(mx/L*0.6+my/L*0.8)));
    s+=`<polygon points="${O[i].join(',')} ${O[j].join(',')} ${I[j].join(',')} ${I[i].join(',')}"
        fill="${mix('#c19a5f','#f7e7c6',t)}" stroke="#a8874f" stroke-width=".8" stroke-linejoin="round"/>`;
  }
  return s;
}
function inHex(x,y,s){
  const pts=hexPts(s||0.70); let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i],[xj,yj]=pts[j];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
/* Liegt der ganze Würfel auf dem Filz, nicht nur sein Mittelpunkt? */
function onFelt(x,y,pad){
  const r=(DE/2)*(pad===undefined?1:pad);
  return inHex(x-r,y-r,0.80)&&inHex(x+r,y-r,0.80)&&inHex(x-r,y+r,0.80)&&inHex(x+r,y+r,0.80);
}
/* Platz im Filz suchen; findet sich keiner, rücken die Würfel enger zusammen */
function freeSpot(taken){
  for(const gap of [1.16,1.06,0.98,0.9,0.82]){
    for(let t=0;t<300;t++){
      const x=DE/2+4+Math.random()*(W-DE-8), y=DE/2+4+Math.random()*(HEXH-DE-8);
      if(!onFelt(x,y)) continue;
      if(taken.every(p=>Math.hypot(p.x-x,p.y-y)>DE*gap)) return {x,y};
    }
  }
  return {x:W/2,y:HEXH/2};
}
function nearWall(){
  const pts=hexPts(0.62), i=Math.floor(Math.random()*pts.length),
        a=pts[i], b=pts[(i+1)%pts.length], m=0.3+Math.random()*0.4;
  return {x:a[0]+(b[0]-a[0])*m, y:a[1]+(b[1]-a[1])*m};
}
function cupSlot(n){
  const i=n%6, g=DE*0.6;
  return {x:W/2-g+(i%3)*g, y:HEXH+10+34+Math.floor(i/3)*g*0.75};
}

/* ================= Holzfläche als Bild ================= */
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
  let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
  return ((t^t>>>14)>>>0)/4294967296; }; }
const FACECACHE={};
function woodFace(v,seed){

         + `106 ${y.toFixed(1)}" stroke="${col}" stroke-width="${w.toFixed(2)}" fill="none" `

        + `<path d="M ${cx-8.2} ${cy+2.2} A ${pr} ${pr} 0 0 1 ${cx+2.2} ${cy-8.3}" `
        + `stroke="#0f0b05" stroke-width="2.2" fill="none" opacity=".38" stroke-linecap="round"/>`
        + `<path d="M ${cx+7.4} ${cy+2.6} A 7.6 7.6 0 0 1 ${cx-2.6} ${cy+7.4}" `
        + `stroke="#c9a465" stroke-width="1.7" fill="none" opacity=".55" stroke-linecap="round"/>`
        + `<circle cx="${cx}" cy="${cy}" r="${pr+0.6}" fill="none" stroke="#8d6a3a" `
        + `stroke-width=".9" opacity=".45"/>`;
  });
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>`
   + `<linearGradient id="w" x1=".1" y1="0" x2=".6" y2="1">`
   + `<stop offset="0" stop-color="#f2ddb6"/><stop offset=".5" stop-color="#e7cd9d"/>`
   + `<stop offset="1" stop-color="#d8b985"/></linearGradient>`
   + `<linearGradient id="l" x1="0" y1="0" x2=".25" y2="1">`
   + `<stop offset="0" stop-color="#fff9ec" stop-opacity=".5"/>`
   + `<stop offset=".45" stop-color="#fff9ec" stop-opacity="0"/>`
   + `<stop offset="1" stop-color="#8a6531" stop-opacity=".22"/></linearGradient>`
   + `<radialGradient id="h" cx=".4" cy=".36" r=".78">`
   + `<stop offset="0" stop-color="#3d2a12"/><stop offset=".6" stop-color="#241806"/>`
   + `<stop offset="1" stop-color="#150e04"/></radialGradient>`
   + `<clipPath id="c"><rect width="100" height="100"/></clipPath></defs>`
   + `<g clip-path="url(#c)"><rect width="100" height="100" fill="url(#w)"/>`
   + grain + `<rect width="100" height="100" fill="url(#l)"/>` + pips + `</g>`
   + `<rect x=".6" y=".6" width="98.8" height="98.8" fill="none" stroke="#a57f47" `
   + `stroke-width="1.2" opacity=".5"/></svg>`;
  return FACECACHE[key]='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}

/* ================= Körper bauen ================= */
const CUBE=[
  {v:1,n:'0,0,1',   t:`translateZ(${HALF}px)`},
  {v:6,n:'0,0,-1',  t:`rotateY(180deg) translateZ(${HALF}px)`},
  {v:2,n:'1,0,0',   t:`rotateY(90deg) translateZ(${HALF}px)`},
  {v:5,n:'-1,0,0',  t:`rotateY(-90deg) translateZ(${HALF}px)`},
  {v:3,n:'0,-1,0',  t:`rotateX(90deg) translateZ(${HALF}px)`},
  {v:4,n:'0,1,0',   t:`rotateX(-90deg) translateZ(${HALF}px)`}];
const FACE={1:[0,0],6:[0,180],2:[0,-90],5:[0,90],3:[-90,0],4:[90,0]};
function pipHTML(v){
  const on=PIPS[v]||[]; let g='';
  for(let k=0;k<9;k++) g+=on.includes(k)?'<i></i>':'<i style="visibility:hidden"></i>';
  return g;
}
function buildBody(i,seed){
  if(i<5) return CUBE.map(f=>
    `<div class="f f6" data-v="${f.v}" data-n="${f.n}" style="transform:${f.t}"></div>`).join('');
  /* Gezeichnet statt aus Flächen gebaut: zehn schräge Ebenen mit Beschneidung
     stellt Chrome nicht zuverlässig dar – geprüft mit echten Aufnahmen. */
  const R=Math.round(D10S*1.4);
  return `<svg class="d10" viewBox="${-R} ${-R} ${2*R} ${2*R}"
    style="position:absolute;left:50%;top:50%;width:${2*R}px;height:${2*R}px;
           margin:${-R}px 0 0 ${-R}px;overflow:visible"></svg>`;
}
/* Zehnseiter für die aktuelle Lage neu zeichnen */
function drawD10(d){
  const svg=d.el.querySelector('svg.d10'); if(!svg) return;
  const fl=D10F.map(f=>{
    const v=f.v.map(pt=>rotXY(d.rx,d.ry,pt));
    const n=rotXY(d.rx,d.ry,f.n);
    return {v,n,z:v.reduce((s,p)=>s+p[2],0)/4,num:f.num,ex:f.ex};
  }).sort((a,b)=>a.z-b.z);
  let out='';
  fl.forEach(f=>{
    if(f.n[2]<=0.02) return;
    const lit=Math.max(0,Math.min(1,0.5-0.5*(f.n[0]*0.5+f.n[1]*0.7-f.n[2]*0.9)));
    const col=`rgb(${Math.round(150+80*lit)},${Math.round(16+34*lit)},${Math.round(26+34*lit)})`;
    out+=`<polygon points="${f.v.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" `
       + `fill="${col}" stroke="#7d0d16" stroke-width=".7" stroke-linejoin="round"/>`;
    if(f.n[2]>0.4){
      const cx=f.v.reduce((s,p)=>s+p[0],0)/4, cy=f.v.reduce((s,p)=>s+p[1],0)/4;
      const gr=7+7*f.n[2];
      /* Ziffer entlang der Fläche kippen, sonst steht sie auf schrägen Seiten kopf */
      const ex=rotXY(d.rx,d.ry,f.ex);
      const dreh=Math.atan2(ex[1],ex[0])*180/Math.PI;
      out+=`<text x="${cx.toFixed(1)}" y="${(cy+gr*0.36).toFixed(1)}" font-size="${gr.toFixed(1)}" `
         + `font-weight="800" fill="#fff" text-anchor="middle" `
         + `transform="rotate(${dreh.toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)})">${f.num}</text>`;
    }
  });
  svg.innerHTML=out;
}

const ease=p=>1-Math.pow(1-p,2.4);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(dur,fn){
  return new Promise(res=>{
    const t0=performance.now();
    (function step(now){
      const p=Math.min(1,(now-t0)/dur); fn(p);
      p<1?requestAnimationFrame(step):res();
    })(t0);
  });
}
function ripple(x,y){
  const r=document.createElement('div');
  r.className='ring'; r.style.left=x+'px'; r.style.top=y+'px';
  boardEl.appendChild(r); r.classList.add('go');
  setTimeout(()=>r.remove(),460);
}
async function throwDie(d,target,delay){
  const [erx,ery,erz]=restRot(d);
  if(slowMo){ d.x=target.x; d.y=target.y; d.rx=erx; d.ry=ery; d.rz=erz; return place(d,0); }
  await wait(delay);
  const from={x:d.x,y:d.y}, rx0=d.rx, ry0=d.ry, rz0=d.rz;
  const spinX=(Math.random()<0.5?-1:1)*(2+Math.floor(Math.random()*3))*360;
  const spinY=(Math.random()<0.5?-1:1)*(1+Math.floor(Math.random()*3))*360;
  const rxEnd=erx+spinX, ryEnd=ery+spinY, rzEnd=erz;
  const mid=Math.random()<0.5?nearWall():null;
  const legs=mid?[[from,mid,300,88,0,0.62],[mid,target,320,36,0.62,0.38]]
                :[[from,target,510,120,0,1]];
  for(const [a,b,dur,hi,r0,rk] of legs){
    await tween(dur,p=>{
      const e=r0?ease(p):p, q=r0+(r0?ease(p):p)*rk;
      d.x=a.x+(b.x-a.x)*e; d.y=a.y+(b.y-a.y)*e;
      d.rx=rx0+(rxEnd-rx0)*q; d.ry=ry0+(ryEnd-ry0)*q; d.rz=rz0+(rzEnd-rz0)*q;
      place(d,hi*4*p*(1-p),1+0.05*Math.sin(Math.PI*p));
    });
    if(mid&&a===from) ripple(mid.x,mid.y);
  }
  d.x=target.x; d.y=target.y; d.rx=rxEnd; d.ry=ryEnd; d.rz=rzEnd;
  ripple(target.x,target.y+6);
  await tween(210,p=>place(d, 10*Math.sin(Math.PI*p)*(1-p), 1+0.12*Math.sin(Math.PI*p)*(1-p)));
  place(d,0);
}

/* Endlage: welche Drehung legt den gewürfelten Wert nach oben? */
function restRot(d){
  if(d.i<5){ const [rx,ry]=FACE[d.v]||[0,0]; return [rx,ry,0]; }
  const f=D10F.find(f=>f.num===d.v);
  const [a,b]=faceCam(f.n);
  const ey=rotXY(a,b,f.ey);                       // Ausrichtung der Ziffer
  const rz=-Math.atan2(ey[0],ey[1])*180/Math.PI;  // aufrecht drehen
  return [a,b,rz];
}
/* Licht von vorn links oben: jede Fläche wird nach ihrer Lage aufgehellt */
function relight(d){
  d.faces.forEach(f=>{
    const n=rotXY(d.rx,d.ry,f.n);
    const lit=0.58+0.46*Math.max(0, n[2]*0.8 - n[1]*0.4 - n[0]*0.22);
    f.el.style.filter='brightness('+lit.toFixed(2)+')';
  });
}
function place(d,h,scale){
  const s=(scale||1)*SC, lift=h||0;
  if(d.i<5) relight(d); else drawD10(d);
  d.el.style.transform=`translate(${d.x-R}px,${d.y-R-lift}px) rotate(${d.rz}deg) scale(${s})`;
  d.body.style.transform=`rotateX(${d.rx}deg) rotateY(${d.ry}deg)`;
  const k=Math.max(0,Math.min(1,lift/120));
  d.sh.style.transform=`translate(${2+k*7}px,${lift+k*4}px) scale(${1+k*0.55})`;
  d.sh.style.opacity=String(0.55-k*0.32);
}


/* ---- Was ist mit diesem Wurf in welchem Kästchen zu holen? ---- */
function scoreFor(row, d){
  const sum=d.reduce((a,b)=>a+b,0), cnt={}; d.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  const has=n=>Object.values(cnt).some(c=>c>=n);
  const kinds=n=>Object.keys(cnt).filter(k=>cnt[k]>=n).length;
  const uniq=[...new Set(d)].sort((a,b)=>a-b);
  let run=1,best=1;
  for(let i=1;i<uniq.length;i++){ run=uniq[i]===uniq[i-1]+1?run+1:1; best=Math.max(best,run); }
  const big=n=>{ const k=Object.keys(cnt).find(x=>cnt[x]>=n);
    return k!==undefined && Object.keys(cnt).some(x=>x!==k && cnt[x]>=2); };
  switch(row.id){
    case 'e1':case 'e2':case 'e3':case 'e4':case 'e5':case 'e6':
      return (cnt[row.die]||0)*row.die;
    case 'l1':  return has(3)?sum:0;        case 'l2':  return has(4)?sum:0;
    case 'l3':  return kinds(2)>=2?sum:0;   case 'l4':  return kinds(2)>=3?35:0;
    case 'l5':  return kinds(3)>=2?45:0;    case 'l6':  return big(3)?25:0;
    case 'l7':  return big(4)?45:0;         case 'l8':  return best>=4?30:0;
    case 'l9':  return best>=5?40:0;        case 'l10': return best>=6?50:0;
    case 'l11': return has(5)?50:0;         case 'l12': return has(6)?75:0;
    case 'l13': return sum<=10?40:0;        case 'l14': return sum>=33?40:0;
    case 'l15': return sum;                 case 'l16': return sum;
    default: return 0;
  }
}
/* Nur noch freie Kästchen vorschlagen, bestes zuerst */
function suggestions(pid, d){
  const s=sheet();
  return ROWS.filter(r=>['count','sum','sum2','fixed'].includes(r.kind))
    .filter(r=>{ const v=cellV(s,pid,r.id); return v===null||v===undefined; })
    .map(r=>{
      const raw=scoreFor(r,d), pts=r.kind==='sum2'?raw*2:raw;
      let ex='';
      if (UPPER.includes(r.id) && raw>0){
        const b=bonusInfo(pid), rest=Math.max(0,b.need-raw);
        ex = rest>0 ? `dann noch ${rest} bis 73` : 'damit ist der Bonus sicher';
      } else if (r.kind==='sum2' && raw>0) ex=`${raw} Augen, doppelt`;
      return {r, raw, pts, ex};
    }).sort((a,b)=>b.pts-a.pts);
}

function makeDice(fresh){
  boardEl.querySelectorAll('.wd,.ring').forEach(e=>e.remove());
  dice=[];
  for(let i=0;i<6;i++){
    const st=board.state[i];
    if(fresh){ st.v=null; st.inCup=true; st.rx=i<5?-14:26; st.ry=i<5?20:-34; st.rz=Math.random()*20-10; }
    const el=document.createElement('div');
    el.className='wd'; el.dataset.i=i;
    el.innerHTML=`<div class="sh"></div><div class="body">${buildBody(i,i+1)}</div>`;
    boardEl.appendChild(el);
    if(i<5) el.querySelectorAll('.f6').forEach(fe=>{ fe.style.backgroundImage=woodFace(+fe.dataset.v,i+1); });
    const d={i, v:st.v, inCup:st.inCup, x:st.x, y:st.y, rx:st.rx, ry:st.ry, rz:st.rz,
             el, body:el.querySelector('.body'), sh:el.querySelector('.sh'), st, faces:[]};
    d.faces = i<5 ? [...el.querySelectorAll('.f')].map((fe,k)=>({el:fe,
      n: CUBE[k].n.split(',').map(Number)})) : [];
    if(d.inCup||d.v===null){ const s=cupSlot(dice.filter(x=>x.inCup).length); d.x=s.x; d.y=s.y; d.inCup=true; }
    else if(!onFelt(d.x,d.y)){ d.x=W/2; d.y=HEXH/2; }
    dice.push(d); place(d,0);
  }
  tidyCup();
}
function saveDice(){ dice.forEach(d=>{ Object.assign(d.st,
  {v:d.v,inCup:d.inCup,x:d.x,y:d.y,rx:d.rx,ry:d.ry,rz:d.rz}); }); }

async function doRoll(){
  const cupDice=dice.filter(d=>d.inCup);
  if(!board||board.busy||board.roll>=3||!cupDice.length) return;
  board.busy=true; board.roll++; updateBoard();
  cupG.classList.add('pour');
  if(navigator.vibrate) navigator.vibrate(12);
  const taken=dice.filter(d=>!d.inCup).map(d=>({x:d.x,y:d.y}));
  await Promise.all(cupDice.map((d,k)=>{
    const t=freeSpot(taken); taken.push(t);
    d.inCup=false;
    d.v = d.i<5 ? 1+Math.floor(Math.random()*6) : Math.floor(Math.random()*10);
    return throwDie(d,t,130+k*75);
  }));
  cupG.classList.remove('pour');
  board.busy=false; saveDice(); pushDice(); updateBoard();
}

/* ---- Ziehen ---- */
let drag=null;
function bindBoard(){
  boardEl.addEventListener('pointerdown',e=>{
    const el=e.target.closest('.wd'); if(!el||board.busy) return;
    const d=dice[+el.dataset.i]; if(d.v===null) return;
    const r=boardEl.getBoundingClientRect();
    drag={d,dx:d.x-(e.clientX-r.left),dy:d.y-(e.clientY-r.top)};
    el.setPointerCapture(e.pointerId); el.classList.add('grab');
    place(d,12,1.08); e.preventDefault();
  });
  boardEl.addEventListener('pointermove',e=>{
    if(!drag) return;
    const r=boardEl.getBoundingClientRect();
    drag.d.x=e.clientX-r.left+drag.dx; drag.d.y=e.clientY-r.top+drag.dy;
    place(drag.d,12,1.08);
    cupEl.classList.toggle('over',overCup(drag.d));
  });
  boardEl.addEventListener('pointerup',endDrag);
  boardEl.addEventListener('pointercancel',endDrag);
}
function overCup(d){ return d.x>W/2-CUPW/2-10 && d.x<W/2+CUPW/2+10 && d.y>HEXH+4; }
function endDrag(){
  if(!drag) return;
  const d=drag.d; d.el.classList.remove('grab'); cupEl.classList.remove('over');
  if(overCup(d)){
    d.inCup=true;
    const n=dice.filter(x=>x.inCup&&x!==d).length, s=cupSlot(n);
    d.x=s.x; d.y=s.y;
    if(navigator.vibrate) navigator.vibrate(8);
  } else {
    d.inCup=false;
    if(!onFelt(d.x,d.y)){
      const c={x:W/2,y:HEXH/2}; let lo=0,hi=1;
      for(let k=0;k<24;k++){const m=(lo+hi)/2; onFelt(c.x+(d.x-c.x)*m,c.y+(d.y-c.y)*m)?lo=m:hi=m;}
      d.x=c.x+(d.x-c.x)*lo; d.y=c.y+(d.y-c.y)*lo;
    }
  }
  place(d,0); drag=null; tidyCup(); saveDice(); pushDice(); updateBoard();
}
function tidyCup(){
  dice.filter(d=>d.inCup).forEach((d,n)=>{const s=cupSlot(n); d.x=s.x; d.y=s.y; place(d,0);});
}

/* ======================= Coop ======================= */
const BROKER = {host:'broker.hivemq.com', port:8884, path:'/mqtt'};
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const makeCode = () => Array.from({length:4},()=>ALPHA[Math.floor(Math.random()*ALPHA.length)]).join('');
let room = null, client = null, connected = false, retryT = null;
/* Wer einer Runde beitritt, bringt sein leeres Blatt nicht mit hinein */
let joining = false, joinT = null, askJoin = null;   // offene Rückfrage beim Beitreten
/* Der Server hebt den letzten Stand einer Runde auf. Beim Beitreten muss die App
   also unterscheiden: kommt das von einem anwesenden Gerät oder aus der Konserve? */
let staleDoc = null, liveSeen = false, joinedAt = 0;
/* Bei wackligem Netz stirbt die Verbindung oft lautlos. Deshalb:
   jede eigene Nachricht kommt als Echo zurück – bleibt es aus, wird neu verbunden. */
let lastRx=0, lastPub=0, echoWait=0, tries=0, stale=false;
let nRx=0, nTx=0, lastPing=null, lastErr='', connecting=false, pingAt=0;
/* Jede Nachricht trägt einen Fingerabdruck des Blocks und die Zahl der Einträge.
   Weicht ein anderes Gerät ab, weiß die App: wir sind nicht gleichauf. */
let peers={}, divergedSince=0, lastNudge=0, lastResub=0, freshSession=false;
const fpOf = s => { let x=5381; for(let i=0;i<s.length;i++) x=((x*33)^s.charCodeAt(i))>>>0; return x.toString(36); };
const myFp = () => fpOf(canon(state.sheets));
const myCount = () => liveSheets().reduce((n,s)=>n+Object.values(s.cells)
  .filter(c=>c&&c.v!==null&&c.v!==undefined).length, 0);
/* Geräte zählen, von denen in den letzten zwei Minuten etwas kam – plus uns selbst.
   Nach oben sofort genau, nach unten träge: wer aufhört, fällt erst verzögert raus. */
function deviceCount(){
  const t=Date.now();
  return 1 + Object.values(peers).filter(p=>t-p.t < 120000).length;
}
function peerGap(){                       // größte Abweichung unter den zuletzt gehörten Geräten
  const t=Date.now(), me=myFp(); let worst=null;
  Object.entries(peers).forEach(([id,p])=>{
    if(t-p.t>60000 || !p.fp || p.fp===me) return;
    if(!worst || Math.abs(p.n-myCount())>Math.abs(worst.n-myCount())) worst={id,...p};
  });
  return worst;
}
/* Strom sparen: nur solange gespielt wird, wird häufig gefunkt.
   Passiert nichts, geht der Takt herunter; im Hintergrund pausiert alles. */
let lastAct=Date.now(), sleeping=false, hiddenAt=0;
const ACTIVE_MS=12000, IDLE_MS=60000, ACTIVE_WINDOW=90000, SLEEP_AFTER=45000;
const busyNow = () => Date.now()-lastAct < ACTIVE_WINDOW;
function activity(){ lastAct=Date.now(); if(sleeping) wake(); }
const NOW = () => Date.now();
const blankSheet = s => Object.values(s.cells||{}).every(c=>!c||c.v===null||c.v===undefined)
                     && s.players.every(p=>!(p.name&&p.name.v));
const nothingOwnYet = () => liveSheets().every(blankSheet);

function chip(){
  const c = document.getElementById('coopChip'), t = document.getElementById('coopText');
  c.className = '';
  if (!room){ t.textContent = 'Offline · zu online wechseln'; }
  else if (sleeping){ c.className='wait'; t.textContent = room+' · pausiert'; }
  else if (!connected){ c.className='wait'; t.textContent = room+' · verbinde…'; }
  else if (stale){ c.className='wait'; t.textContent = room+' · wackelig'; }
  else if (divergedSince){ c.className='wait'; t.textContent = room+' · gleicht ab'; }
  else {
    const n=deviceCount();
    c.className='live';
    t.textContent = room+' · '+(n===1 ? 'allein drin' : n+' Geräte');
  }
}

const topic     = () => 'kniffelx/'+room+'/v2';
const diceTopic = () => 'kniffelx/'+room+'/dice';
let remoteDice = null, stripT = null, stripSeen = '';
function pushDice(){
  if (!room || !connected || !client || !board || !board.roll) return;
  try{
    const p = livePlayers(sheet()).find(x=>x.id===board.pid);
    const msg = new Paho.Message(JSON.stringify({by:DEV, name:(p&&p.name.v)||'',
      vals:board.state.map(s=>s.v===null?0:s.v), roll:board.roll}));
    /* Würfel sind flüchtig: nicht aufbewahren, sonst begrüßt der letzte Wurf
       der Vorwoche jeden, der die Runde betritt. */
    msg.destinationName = diceTopic(); msg.qos = 0; msg.retained = false;
    client.send(msg);
  }catch(e){}
}
function onDice(d){
  if (!d || d.by===DEV || !Array.isArray(d.vals) || !d.roll) return;
  if (d.__retained) return;              // alte Konserve vom Server: ignorieren
  const neu = {name:String(d.name||'').slice(0,24).replace(/[<>&"']/g,''),
    roll:Math.max(1,Math.min(3, +d.roll||1)),
    vals:d.vals.slice(0,6).map(v=>Number.isFinite(+v)?Math.max(0,Math.min(9,+v)):0)};
  if (stripKey(neu)===stripSeen) return;   // genau dieser Wurf wurde weggetippt
  remoteDice = neu; drawStrip();
  clearTimeout(stripT);
  stripT = setTimeout(()=>{ remoteDice=null; drawStrip(); }, 10000);   // blendet sich nach 10 s aus
}
function drawStrip(){
  const el = document.getElementById('diceStrip');
  if (!remoteDice){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `<span class="who">${remoteDice.name||'Mitspieler'} · Wurf ${remoteDice.roll}</span>
    <span class="mini">${remoteDice.vals.map((v,i)=>`<span class="${i===5?'x':''}">${v}</span>`).join('')}</span>
    <button class="x" id="stripX" title="ausblenden">✕</button>`;
  document.getElementById('stripX').onclick=()=>{
    stripSeen = stripKey(remoteDice);      // dieser Wurf bleibt weg, der nächste kommt wieder
    remoteDice=null; clearTimeout(stripT); drawStrip();
  };
}
const stripKey = d => (d.name||'')+'|'+d.roll+'|'+d.vals.join(',');

/* Zwei gleichzeitige Verbindungen mit derselben Kennung werfen sich gegenseitig
   vom Server – das erzeugt eine Endlosschleife aus Neuverbinden und Senden.
   Deshalb: immer nur ein Versuch, und alte Verbindungen werden stillgelegt. */
function connect(){
  retryT=null;
  if (!room || !window.Paho || connecting || sleeping) return;
  if (client && client.isConnected()){ connected=true; chip(); return; }
  connecting = true;
  if (client){                       // alte Verbindung abklemmen, damit sie nichts mehr auslöst
    try{ client.onConnectionLost=null; client.onMessageArrived=null; }catch(e){}
    try{ client.disconnect(); }catch(e){}
    client=null;
  }
  const me = new Paho.Client(BROKER.host, BROKER.port, BROKER.path, 'kx'+DEV);
  client = me;
  client.onConnectionLost = (e) => {
    if (client !== me) return;       // Meldung einer längst ersetzten Verbindung
    connecting=false;
    connected=false; echoWait=0;
    lastErr=(e&&e.errorMessage||'Verbindung abgebrochen').slice(0,60); chip();
    clearTimeout(retryT);
    retryT=setTimeout(connect, Math.min(20000, 1500*Math.pow(1.7, tries++)));  // wachsender Abstand
  };
  client.onMessageArrived = m => { try{
    const p = JSON.parse(m.payloadString);
    p.__retained = !!m.retained;
    lastRx=NOW(); nRx++;
    if (p && p.by===DEV){                       // eigenes Echo: Leitung steht
      if(pingAt) lastPing=lastRx-pingAt;
      echoWait=0; if(stale){ stale=false; chip(); } }
    if (String(m.destinationName||'').endsWith('/dice')) onDice(p); else onRemote(p);
  }catch(e){} };
  client.connect({
    /* cleanSession:false -> der Server hebt verpasste Nachrichten auf und liefert sie
       beim nächsten Verbinden nach. Genau das fehlt bei wackligem Netz. */
    useSSL:true, timeout:10, keepAliveInterval:40, cleanSession:freshSession, reconnect:false,
    onSuccess: () => { if(client!==me) return;
      connecting=false; connected=true; tries=0; stale=false; freshSession=false;
      lastRx=NOW(); chip();
      client.subscribe(topic(),{qos:1}); client.subscribe(diceTopic(),{qos:0});
      if (joining){ clearTimeout(joinT);
        joinT=setTimeout(()=>{ joining=false; push(); }, 5000); }  // niemand da? dann doch senden
      else setTimeout(push,600); },
    onFailure: (e) => { if(client!==me) return;
      connecting=false; connected=false;
      lastErr=(e&&e.errorMessage||'Verbindung abgelehnt').slice(0,60); chip();
      clearTimeout(retryT);
      retryT=setTimeout(connect, Math.min(20000, 2000*Math.pow(1.6, tries++))); }
  });
  chip();
}
function leave(){
  clearTimeout(retryT); clearTimeout(joinT); joining=false;
  try{ if(client && client.isConnected()) client.disconnect(); }catch(e){}
  client=null; connected=false; room=null; remoteDice=null; stale=false; echoWait=0;
  peers={}; divergedSince=0; lastPing=null; freshSession=true;
  staleDoc=null; liveSeen=false; joining=false; clearTimeout(joinT); drawStrip();
  localStorage.removeItem(RKEY); history.replaceState(null,'',location.pathname);
  chip();
}
let pushPend=false, pushGapT=null;
const MIN_GAP=2000;                  // höchstens alle zwei Sekunden senden
function push(){
  if (!room || !connected || !client || sleeping) return;
  const gap = NOW()-lastPub;
  if (gap < MIN_GAP){                // zu schnell hintereinander: einmal nachholen, nicht stapeln
    if (pushPend) return;
    pushPend=true;
    clearTimeout(pushGapT);
    pushGapT=setTimeout(()=>{ pushPend=false; doPush(); }, MIN_GAP-gap);
    return;
  }
  doPush();
}
function doPush(){
  if (!room || !connected || !client || sleeping) return;
  try{
    const mine = lastPid && livePlayers(sheet()).find(x=>x.id===lastPid);
    const msg = new Paho.Message(JSON.stringify({by:DEV, sheets:state.sheets,
      fp:myFp(), n:myCount(), ver:VERSION.split(' ')[0], who:(mine&&mine.name.v)||''}));
    lastPub=NOW(); nTx++; pingAt=lastPub; if(!echoWait) echoWait=lastPub;
    msg.destinationName = topic(); msg.qos = 1; msg.retained = true;
    client.send(msg);
  }catch(e){}
}
let pushT=null;
function pushSoon(){ clearTimeout(pushT); pushT=setTimeout(push,350); }

function nap(){                       // Verbindung schlafen legen
  if(sleeping||!room) return;
  sleeping=true; clearTimeout(retryT); retryT=null;
  try{ if(client&&client.isConnected()) client.disconnect(); }catch(e){}
  connected=false; echoWait=0; chip();
}
function wake(){                       // und wieder aufwecken
  if(!room) return;
  sleeping=false; hiddenAt=0;
  if(!connected){ clearTimeout(retryT); tries=0; retryT=setTimeout(connect,150); }
  else push();
  chip();
}
/* Alle paar Sekunden nachsehen, ob die Runde noch wirklich verbunden ist */
setInterval(()=>{
  if(!room || sleeping) return;
  if(document.hidden){                 // im Hintergrund nach kurzer Frist abschalten
    if(!hiddenAt) hiddenAt=Date.now();
    else if(Date.now()-hiddenAt>SLEEP_AFTER) nap();
    return;
  }
  hiddenAt=0;
  const t=NOW();
  if(!connected){ if(!retryT){ retryT=setTimeout(connect,300); } return; }
  if(echoWait && t-echoWait>7000){        // eigene Nachricht kam nie zurück
    stale=true; chip(); echoWait=0;
    try{ client.disconnect(); }catch(e){}  // löst onConnectionLost und Neuaufbau aus
    connected=false; clearTimeout(retryT); retryT=setTimeout(connect,600);
    return;
  }
  if(divergedSince){                       // Blöcke unterscheiden sich: nachfassen
    if(t-lastNudge>6000){
      lastNudge=t;
      push();                                   // nur senden
      /* Erneut anmelden liefert den gespeicherten Stand nach – aber selten,
         denn zwischen Ab- und Anmeldung können Nachrichten verlorengehen. */
      if(t-lastResub>30000){ lastResub=t;
        try{ client.subscribe(topic(),{qos:1}); }catch(e){} }
    }
    if(t-divergedSince>45000) divergedSince=0;   // aufgegeben, Anzeige nicht ewig blockieren
  }
  if(t-lastPub > (divergedSince?4000:(busyNow()?ACTIVE_MS:IDLE_MS))) push();
  chip();                                  // Gerätezahl aktuell halten             // hält den gespeicherten Stand frisch und prüft die Leitung
}, 5000);

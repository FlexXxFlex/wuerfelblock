/* Zusammenführen: bei jedem Feld gewinnt der neuere Eintrag */
/* Neuerer Eintrag gewinnt; bei exakt gleichem Stand entscheidet die Gerätekennung,
   damit alle Geräte unabhängig voneinander zum selben Ergebnis kommen. */
const pick = (a,b) => !a ? b : !b ? a
  : b.t>a.t ? b : a.t>b.t ? a
  : ((b.d||'')>(a.d||'') ? b : a);
function mergeSheet(a,b){
  const out = {id:a.id, created:Math.min(a.created,b.created), del:pick(a.del,b.del), players:[], cells:{}};
  const pm = new Map();
  a.players.concat(b.players).forEach(p=>{
    const ex = pm.get(p.id);
    pm.set(p.id, ex ? {id:p.id, created:Math.min(ex.created,p.created),
                       name:pick(ex.name,p.name), del:pick(ex.del,p.del)} : {...p});
  });
  out.players = [...pm.values()].sort((x,y)=>x.created-y.created);
  new Set(Object.keys(a.cells).concat(Object.keys(b.cells))).forEach(k=>{
    out.cells[k] = pick(a.cells[k], b.cells[k]);
  });
  return out;
}
function mergeAll(mine, theirs){
  const m = new Map();
  mine.forEach(s=>m.set(s.id,s));
  theirs.forEach(s=>{ const ex=m.get(s.id); m.set(s.id, ex?mergeSheet(ex,s):s); });
  return [...m.values()].sort((x,y)=>x.created-y.created);
}
const OKID = /^[A-Za-z0-9_-]{1,16}$/;
const okNum = (n,max) => (typeof n==='number' && isFinite(n) && n>=0 && n<=max) ? n : null;
const okT   = t => (typeof t==='number' && isFinite(t) && t>=0) ? t : 0;
const okTxt = s => (typeof s==='string' ? s : '').replace(/[<>&"']/g,'').slice(0,24);
const okDel = d => ({v: (d && d.v) ? 1 : 0, t: okT(d && d.t), d: okTxt(d && d.d)});
const ROWIDS = new Set(ROWS.filter(r=>r.kind!=='calc'&&r.kind!=='gap').map(r=>r.id));
/* Fremde Nachrichten koennen alles Moegliche enthalten – hier wird nur
   durchgelassen, was wirklich wie ein Kniffelblock aussieht. */
function sane(list){
  if (!Array.isArray(list)) return [];
  return list.slice(0,40).filter(s=>s && OKID.test(s.id||'')).map(s=>{
    const ids = new Set();
    const players = (Array.isArray(s.players)?s.players:[]).slice(0,MAXP*2)
      .filter(p=>p && OKID.test(p.id||'') && !ids.has(p.id) && ids.add(p.id))
      .map(p=>({id:p.id, created:okT(p.created),
                name:{v:okTxt(p.name&&p.name.v), t:okT(p.name&&p.name.t),
                      d:okTxt(p.name&&p.name.d)}, del:okDel(p.del)}));
    const cells = {};
    Object.keys(s.cells||{}).slice(0,MAXP*2*ROWIDS.size).forEach(k=>{
      const [pid,row] = String(k).split('~');
      if (!ids.has(pid) || !ROWIDS.has(row)) return;
      const c = s.cells[k]; if (!c || typeof c!=='object') return;
      cells[pid+'~'+row] = {v:(c.v===null||c.v===undefined)?null:okNum(c.v,300),
                            t:okT(c.t), d:okTxt(c.d)};
    });
    return {id:s.id, created:okT(s.created), del:okDel(s.del), players, cells};
  });
}
/* Vergleich unabhängig von Reihenfolge und Nebenfeldern – sonst sieht jede
   empfangene Nachricht "anders" aus und löst eine endlose Antwortkette aus. */
function canon(sheets){
  return JSON.stringify(sheets.slice().sort((a,b)=>a.id<b.id?-1:1).map(s=>({
    i:s.id, c:s.created, x:[s.del.v,s.del.t],
    p:s.players.slice().sort((a,b)=>a.id<b.id?-1:1)
       .map(q=>[q.id,q.created,q.name.v,q.name.t,q.del.v,q.del.t]),
    z:Object.keys(s.cells).sort().map(k=>[k,s.cells[k].v,s.cells[k].t])
  })));
}
function onRemote(raw){
  if (!raw) return;
  const fromSelf = raw.by===DEV;
  if (raw.hello){ if(!fromSelf) push(); return; }     // jemand fragt: wir melden uns
  if (!Array.isArray(raw.sheets)) return;
  if (!fromSelf && !raw.__retained) liveSeen = true;  // da ist wirklich jemand
  if (joining && raw.__retained && !fromSelf){
    staleDoc = raw;                                   // erstmal zurückhalten
    return;
  }
  if (!fromSelf && typeof raw.by==='string' && raw.by.length<24){
    const known = peers[raw.by] || {};
    /* Ältere Fassungen schicken keinen Fingerabdruck. Die dürfen nicht als
       "abweichend mit 0 Einträgen" gelten – sonst gleicht die App endlos ab. */
    const neu = !peers[raw.by];
    peers[raw.by] = raw.fp ? {fp:String(raw.fp).slice(0,12), n:+raw.n||0, t:Date.now(),
        ver:String(raw.ver||'?').slice(0,8).replace(/[<>&"']/g,''),
        who:String(raw.who||'').slice(0,24).replace(/[<>&"']/g,'')}
      : {...known, fp:null, n:null, t:Date.now(),
         ver:String(raw.ver||'alt').slice(0,8).replace(/[<>&"']/g,''),
         who:String(raw.who||known.who||'').slice(0,24).replace(/[<>&"']/g,'')};
    if(neu) chip();                        // neues Gerät sofort anzeigen
  }
  const doc = {sheets: sane(raw.sheets)};
  if (!doc.sheets.length) return;
  if (joining && !fromSelf){          // erste Nachricht von einem anwesenden Gerät
    joining=false; clearTimeout(joinT); staleDoc=null;
    const fremdVoll = doc.sheets.some(s=>!s.del.v &&
      Object.values(s.cells||{}).some(c=>c&&c.v!==null&&c.v!==undefined));
    if (nothingOwnYet()){             // eigenes Blatt ist unbenutzt: übernehmen statt dazulegen
      state.sheets = doc.sheets;
      state.activeId = (liveSheets()[0]||{}).id;
      lastSig=''; render(); saveLocal();
      return;
    }
    if (fremdVoll){                   // beide Seiten haben Inhalt: nachfragen, nichts vermischen
      askJoin = doc.sheets;
      askJoinDialog();
      return;                         // bis zur Entscheidung wird nichts gesendet
    }
  }
  /* Die Uhren der Handys gehen unterschiedlich. Deshalb zählt nicht die Uhrzeit,
     sondern eine Zahl, die immer über allem liegt, was wir je gesehen haben –
     sonst verlieren die Einträge des Geräts mit der nachgehenden Uhr für immer. */
  doc.sheets.forEach(s=>{
    lastT = Math.max(lastT, s.created||0, (s.del&&s.del.t)||0);
    s.players.forEach(pl=>{ lastT = Math.max(lastT, pl.created||0,
      (pl.name&&pl.name.t)||0, (pl.del&&pl.del.t)||0); });
    Object.values(s.cells).forEach(c=>{ if(c) lastT = Math.max(lastT, c.t||0); });
  });
  const warLeer = nothingOwnYet();
  const bringtInhalt = doc.sheets.some(s=>!s.del.v &&
    Object.values(s.cells||{}).some(c=>c&&c.v!==null&&c.v!==undefined));
  const before = canon(state.sheets);
  const merged = mergeAll(state.sheets, doc.sheets);
  state.sheets = merged;
  if (!sheet() && liveSheets()[0]) state.activeId = liveSheets()[0].id;
  /* Waren wir leer und bekommen einen echten Block: eigenes Leerblatt
     zurückziehen. Als Löschvermerk, damit es auch bei den anderen verschwindet. */
  if (warLeer && bringtInhalt && room && Date.now()-joinedAt < 180000){
    let weg=false;
    state.sheets.forEach(s=>{
      if(!s.del.v && blankSheet(s) && !doc.sheets.some(f=>f.id===s.id)){ s.del=stamp(1); weg=true; }
    });
    if(weg){
      if(!sheet() && liveSheets()[0]) state.activeId = liveSheets()[0].id;
      lastSig=''; setTimeout(push, 300);
    }
  }
  const mergedStr = canon(merged);
  if (mergedStr !== before){ lastAct=Date.now(); src='theirs'; render(); src='mine'; saveLocal(); flash(); maybeFinal(); }
  /* Nur antworten, wenn wir wirklich etwas haben, das dem anderen fehlt –
     und niemals auf das eigene Echo. */
  if (!fromSelf && mergedStr !== canon(doc.sheets)) setTimeout(push, 600+Math.random()*900);
  /* Nach dem Zusammenführen prüfen, ob wir wirklich gleichauf sind */
  if (!fromSelf){
    const me=myFp();
    if (raw.fp && peers[raw.by] && peers[raw.by].fp && peers[raw.by].fp!==me){
      if(!divergedSince) divergedSince=Date.now();
    } else if (peerGap()===null) divergedSince=0;
    chip();
  }
}

    'Takt: '+(busyNow()?'aktiv, alle 12 s':'ruhend, alle 60 s'),

    'zuletzt gesendet: '+s(lastPub),
    'Geräte in der Runde: '+deviceCount(),
    'Nachrichten: '+nTx+' raus / '+nRx+' rein',
    (()=>{ const t=Date.now(), mine=VERSION.split(' ')[0];
      const alt=Object.values(peers).filter(p=>t-p.t<120000 && p.ver && p.ver!==mine);
      if(!alt.length) return nRx>40&&nRx>nTx*6 ? '⚠ Ein anderes Handy sendet zu viel' : '';
      return '⚠ '+alt.map(p=>(p.who||'ein Gerät')+' läuft auf '+p.ver).join(', ')+' – dort neu laden';
    })(),
    'Antwortzeit: '+(lastPing!==null?lastPing+' ms':'—'),
    (()=>{ const g=peerGap();
      return g ? '⚠ nicht gleichauf: du '+myCount()+' Einträge, anderes Gerät '+g.n
               : 'Blöcke gleichauf: '+myCount()+' Einträge'; })(),

  ].filter(Boolean).join('<br>');

function enterRoom(code, isJoin){
  const neu = code.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);
  if (neu.length<4) return;
  if (room && room!==neu){
    /* Alte Runde sauber abmelden. Die Sitzung beim Server merkt sich sonst das
       alte Thema – man bekäme weiter die Nachrichten der vorigen Runde. */
    try{ if(client && client.isConnected()){ client.unsubscribe(topic()); client.unsubscribe(diceTopic()); } }catch(e){}
    try{ if(client && client.isConnected()) client.disconnect(); }catch(e){}
    connected=false; connecting=false; client=null; freshSession=true;
  }
  peers={}; divergedSince=0; lastPing=null; remoteDice=null;
  staleDoc=null; liveSeen=false; clearTimeout(joinT); drawStrip();
  room = neu; joinedAt = Date.now();
  joining = !!isJoin;
  localStorage.setItem(RKEY, room);
  history.replaceState(null,'','#'+room);
  connect(); openCoop();
}

};

/* ---- Nach unten ziehen holt den Stand der Runde neu ---- */
const pullBar=document.getElementById('pullbar'), pullTxt=document.getElementById('pulltext');
const PULL_TRIGGER=56;
let pullStart=null, pullNow=0, refreshing=false, pullId=null;
function setPull(px, text){
  pullNow=px;
  pullBar.style.transform='translateY('+(px-14)+'px)';
  pullBar.style.opacity = px>3 ? Math.min(1, px/40) : 0;
  if(text) pullTxt.textContent=text;
}
function onPullStart(y){
  if(refreshing) return;
  pullStart = scEl.scrollTop<=2 ? y : null;   // nur ganz oben
}
function onPullMove(y){
  if(refreshing || pullStart===null) return false;
  const dy=y-pullStart;
  if(scEl.scrollTop>2){ pullStart=null; setPull(0); return false; }
  if(dy<=0){ setPull(0); return false; }
  setPull(Math.min(96, dy*0.6), dy*0.6>=PULL_TRIGGER ? 'Loslassen zum Aktualisieren'
                                                     : 'Zum Aktualisieren ziehen');
  return true;
}
function onPullEnd(){
  if(pullStart===null) return;
  const d=pullNow; pullStart=null;
  pullBar.classList.add('snap');
  if(d>=PULL_TRIGGER) refresh(); else setPull(0);
}
/* Holt den Stand der Runde neu und meldet ehrlich, was dabei herauskam */
function refresh(){
  if(refreshing) return;
  refreshing=true; lastAct=Date.now(); if(sleeping) sleeping=false;
  checkUpdate(true);                       // beim Ziehen auch nach einer neuen Fassung sehen pullBar.classList.add('busy');
  pullBar.classList.add('snap'); setPull(PULL_TRIGGER,'Aktualisiere…');
  const seen=lastRx;
  if(room){
    if(!connected){ clearTimeout(retryT); tries=0; connect(); }
    else {
      try{ client.subscribe(topic(),{qos:1}); }catch(e){}
      try{ client.subscribe(diceTopic(),{qos:0}); }catch(e){}
      echoWait=0; push();
    }
  }
  setTimeout(()=>{
    pullBar.classList.remove('busy');
    const ok = lastRx>seen;                    // ist wirklich etwas angekommen?
    setPull(PULL_TRIGGER,
      newVer ? 'Neue Version '+newVer.split(' ')[0]+' – oben neu laden'
      : !room ? 'Du spielst allein – nichts abzugleichen'
      : ok ? 'Stand geholt' : connected ? 'Keine Antwort – versuche weiter' : 'Keine Verbindung');
    if(room && !ok){ stale=true; chip(); clearTimeout(retryT); tries=0;
                     try{ client.disconnect(); }catch(e){} connected=false; retryT=setTimeout(connect,400); }
    setTimeout(()=>{ setPull(0); pullBar.classList.remove('snap'); refreshing=false; }, 1300);
  }, 2500);
}
scEl.addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  pullId=e.touches[0].identifier; pullBar.classList.remove('snap');
  onPullStart(e.touches[0].clientY);
}, {passive:true});
scEl.addEventListener('touchmove', e=>{
  const t=[...e.touches].find(x=>x.identifier===pullId); if(!t) return;
  if(onPullMove(t.clientY) && e.cancelable) e.preventDefault();
}, {passive:false});
scEl.addEventListener('touchend', onPullEnd, {passive:true});
scEl.addEventListener('touchcancel', ()=>{ pullStart=null; setPull(0); }, {passive:true});

/* ---- Spaltenfarben an oder aus, Einstellung bleibt gespeichert ---- */
const TKEY='kniffel-tint';
function setTint(on){
  document.body.classList.toggle('tint', on);
  const b=document.getElementById('tintBtn');
  b.classList.toggle('off', !on);
  b.textContent = on ? 'Farben an' : 'Farben';
  try{ localStorage.setItem(TKEY, on?'1':'0'); }catch(e){}
}
document.getElementById('tintBtn').onclick=()=>setTint(!document.body.classList.contains('tint'));
try{ setTint(localStorage.getItem(TKEY)==='1'); }catch(e){ setTint(false); }

/* ======================= Speichern ======================= */
const KEY = 'kniffel-extreme-v3', RKEY = 'kniffel-room';
let saveT=null;
function saveLocal(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} },300);
}
/* Ohne Verzögerung schreiben – vor dem Neuladen und beim Verlassen der Seite */
function saveNow(){
  clearTimeout(saveT);
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
addEventListener('pagehide', saveNow);
addEventListener('beforeunload', saveNow);

/* Schaut nach, ob eine neuere Fassung vorliegt – sparsam: erst nur die
   Kopfzeilen abfragen (wenige Bytes), die ganze Datei nur bei echter Änderung. */
let newVer=null, lastCheck=0, fileTag=null;
async function fileStamp(){
  const r=await fetch(location.pathname+'?cb='+Date.now(), {method:'HEAD', cache:'no-store'});
  if(!r.ok) return null;
  return r.headers.get('etag') || r.headers.get('last-modified') || null;
}
async function checkUpdate(force){
  if(newVer) return;
  if(!force && Date.now()-lastCheck < 300000) return;   // von selbst höchstens alle fünf Minuten
  lastCheck=Date.now();
  try{
    const tag=await fileStamp();
    if(!tag){ return; }
    if(fileTag===null){ fileTag=tag; return; }          // erster Abgleich merkt sich nur den Stand
    if(tag===fileTag) return;                           // unverändert: keine weiteren Daten nötig
    const r=await fetch(location.pathname+'?cb='+Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const m=(await r.text()).match(/const VERSION = '([^']+)'/);
    fileTag=tag;
    if(m && m[1] && m[1]!==VERSION){
      newVer=m[1];
      const bar=document.getElementById('upbar');
      bar.querySelector('b').textContent='Neue Version '+m[1].split(' ')[0]+' verfügbar';
      bar.classList.add('on');
    }
  }catch(e){}
}
document.getElementById('upBtn').onclick=()=>{
  saveNow();                                  // erst sichern, dann neu laden
  location.replace(location.pathname+'?v='+encodeURIComponent(newVer||'').slice(0,8));
};
setTimeout(checkUpdate, 8000);
setInterval(checkUpdate, 3600000);                       // einmal pro Stunde reicht
addEventListener('focus', ()=>setTimeout(checkUpdate,800));

function loadLocal(){
  try{
    const raw = localStorage.getItem(KEY); if(!raw) return;
    const s = JSON.parse(raw);
    if (s && Array.isArray(s.sheets) && s.sheets.length){
      state = s;
      state.sheets.forEach(sh=>{ lastT = Math.max(lastT, sh.created||0); });
      if (!sheet()) state.activeId = (liveSheets()[0]||{}).id;
    }
  }catch(e){}
}

document.getElementById('ver').textContent = 'Version '+VERSION;

/* ======================= Start ======================= */
loadLocal();
if (!state.sheets.length || !sheet()){ const s=newSheet(); state.sheets=[s]; state.activeId=s.id; }
buildTable(); lastSig = livePlayers(sheet()).map(p=>p.id).join(',')+'|'+sheet().id;
render(); chip();
setTimeout(maybeFinal, 900);      // fertiges Blatt beim Öffnen der App ebenfalls zeigen

const fromUrl = (location.hash||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase().slice(0,4);
const saved = localStorage.getItem(RKEY);
if (fromUrl.length===4) enterRoom(fromUrl, true);
else if (saved) { room = saved; connect(); }
